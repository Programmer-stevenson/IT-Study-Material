function startExam(){
  const weights={D1:20,D2:20,D3:25,D4:10,D5:15,D6:10};
  let pool=[];
  Object.entries(weights).forEach(([d,n])=>{
    const bank = QUIZ_BANK.filter(q=>q[0]===d).sort(()=>Math.random()-0.5);
    if(!bank.length) return;
    let picks=[];
    while(picks.length<n){
      const need=n-picks.length;
      picks = picks.concat(bank.slice(0,need));
      if(bank.length<need){ bank.sort(()=>Math.random()-0.5); } // reshuffle to allow repeats if domain is short
    }
    pool = pool.concat(picks.slice(0,n));
  });
  pool = pool.sort(()=>Math.random()-0.5);
  STATE.exam = {
    pool, idx:0,
    picks:new Array(pool.length).fill(null),
    flagged:{},
    startTime:Date.now(),
    durationMs:120*60*1000,
    timerId:null,
    finished:false
  };
  STATE.exam.timerId = setInterval(tickExam, 1000);
  buildPageContent('exam', $('#page-exam'));
}

function tickExam(){
  const e=STATE.exam; if(!e || e.finished) return;
  const left = e.durationMs - (Date.now()-e.startTime);
  if(left<=0){ finishExam(); return; }
  const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  const t = $('#examTimer');
  if(t){
    t.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    t.classList.toggle('warn', m<15);
    t.classList.toggle('danger', m<5);
  }
}

function examRunHTML(){
  const e=STATE.exam;
  const item=e.pool[e.idx];
  const [dom,question,opts] = item;
  const pick = e.picks[e.idx];
  const flagged = !!e.flagged[e.idx];
  const answered = e.picks.filter(p=>p!=null).length;

  const navBtns = e.pool.map((_,i)=>{

  }).join('');
  return `<div class="exam-timer" id="examTimer">⏱ 120:00</div>
  <div class="exam-head">
    <div><strong>Question ${e.idx+1}</strong> of ${e.pool.length} · <span class="muted">${answered} answered · ${flagCount} flagged</span></div>

      <button class="flag-btn ${flagged?'on':''}" onclick="flagExam()">${flagged?'🚩 Flagged':'⚐ Flag'}</button>

    <div class="quiz-options">${opts.map((o,i)=>{
      const sel = pick===i ? ' style="border-color:var(--teal);background:rgba(45,212,191,.08)"' : '';
      return `<button class="quiz-opt" ${sel} onclick="pickExam(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</button>`;
    }).join('')}</div>

function flashHTML(){

function initFlash(){
  if(!STATE.flash.order.length) STATE.flash.order = GLOSSARY.map((_,i)=>i).sort(()=>Math.random()-0.5);
  renderFlash();
}
function setFlashSource(src){
  STATE.flash.source = src;
  const data = src==='glossary'?GLOSSARY:ACRONYMS;
  STATE.flash.order = data.map((_,i)=>i).sort(()=>Math.random()-0.5);
  STATE.flash.idx=0; STATE.flash.flipped=false;
  renderFlash();
}
function shuffleFlash(){
  STATE.flash.order.sort(()=>Math.random()-0.5);
  STATE.flash.idx=0; STATE.flash.flipped=false; renderFlash();
}
function renderFlash(){
  const f = STATE.flash;
  const data = f.source==='glossary'?GLOSSARY:ACRONYMS;
  const i = f.order[f.idx % f.order.length];
  const [term, def] = data[i];
  const known = !!f.known[f.source+':'+term];
  const lblA = f.source==='glossary'?'TERM':'ACRONYM';
  const lblB = f.source==='glossary'?'DEFINITION':'EXPANSION';
  $('#flashArea').innerHTML = `
    <div class="flash-card ${f.flipped?'flipped':''}" onclick="STATE.flash.flipped=!STATE.flash.flipped;renderFlash()">
      <div class="fc-inner">
        <div class="fc-face fc-front"><div class="fc-label">${lblA}</div><div class="fc-q">${escapeHtml(term)}</div><div class="fc-hint">Click to flip</div></div>
        <div class="fc-face fc-back"><div class="fc-label">${lblB}</div><div class="fc-term">${escapeHtml(term)}</div><div class="fc-a">${escapeHtml(def)}</div></div>
      </div>
    </div>
    <div class="flash-actions">
      <button class="flagbtn" onclick="fcPrev()">← Prev</button>
      <button class="flagbtn ${known?'on':''}" onclick="fcToggleKnown()">${known?'✅ Known':'Mark Known'}</button>
      <button class="flagbtn" onclick="fcNext()">Next →</button>
    </div>`;
  $('#fcCount').textContent = `${f.idx+1} / ${f.order.length} · ${f.source}`;
}
function fcNext(){ STATE.flash.idx=(STATE.flash.idx+1)%STATE.flash.order.length; STATE.flash.flipped=false; renderFlash(); }
function fcPrev(){ STATE.flash.idx=(STATE.flash.idx-1+STATE.flash.order.length)%STATE.flash.order.length; STATE.flash.flipped=false; renderFlash(); }
function fcToggleKnown(){
  const f = STATE.flash;
  const data = f.source==='glossary'?GLOSSARY:ACRONYMS;
  const i = f.order[f.idx % f.order.length];
  const term = data[i][0]; const k = f.source+':'+term;
  if(f.known[k]) delete f.known[k]; else f.known[k]=true;
  renderFlash();
}

/* -------- GLOBAL SEARCH -------- */
function globalSearch(q){
  q=(q||'').trim().toLowerCase();
  const r = $('#searchResults');
  if(!q){
    $('#page-search').classList.remove('active');
    const cur=currentPageId();
    if(cur==='search') showPage('home');
    return;
  }
  // hit cards across chapters
  const cardHits=[];
  CH.forEach(ch=>ch.cards.forEach((c,i)=>{
    const hay = (c.title+' '+c.sub+' '+c.html.replace(/<[^>]+>/g,'')).toLowerCase();
    if(hay.includes(q)) cardHits.push({ch,c,i});
  }));
  const glossHits = GLOSSARY.filter(([t,d])=>(t+' '+d).toLowerCase().includes(q)).slice(0,15);
  const acroHits = ACRONYMS.filter(([a,e])=>(a+' '+e).toLowerCase().includes(q)).slice(0,15);
  $$('.page').forEach(p=>p.classList.remove('active'));
  $$('.tab').forEach(t=>t.classList.remove('active'));
  $('#page-search').classList.add('active');
  $('#searchTitle').textContent = `Results for "${q}"`;
  $('#searchSummary').innerHTML = `${cardHits.length} card${cardHits.length===1?'':'s'} · ${glossHits.length} glossary · ${acroHits.length} acronyms`;
  r.innerHTML = `
    ${cardHits.length?`<h4>📚 Cards · ${cardHits.length}</h4>${cardHits.slice(0,40).map(h=>{
      const dom=h.ch.domain;
      const pill = ['1','2','3','4','5','6'].includes(dom)?`<span class="dom-pill d${dom}">D${dom}</span> `:'';
      return `<div class="search-hit" onclick="showPage('${h.ch.id}');setTimeout(()=>{const c=document.querySelector('[data-cid=\\'${h.ch.id}-${h.i}\\']');if(c){c.classList.add('open');c.scrollIntoView({behavior:'smooth',block:'center'})}},150)">
        ${pill}<strong>${escapeHtml(h.c.title)}</strong>
        <p>${escapeHtml((h.c.sub||'')+' — '+h.c.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,160))}…</p>
      </div>`;
    }).join('')}`:''}
    ${glossHits.length?`<h4>📖 Glossary · ${glossHits.length}</h4>${glossHits.map(([t,d])=>`<div class="search-hit" onclick="showPage('gloss');setTimeout(()=>{const i=document.querySelector('#glossSearch');if(i){i.value='${t.replace(/'/g,"\\'")}';filterGloss(i.value)}},150)"><strong>${escapeHtml(t)}</strong><p>${escapeHtml(d)}</p></div>`).join('')}`:''}
    ${acroHits.length?`<h4>🔤 Acronyms · ${acroHits.length}</h4>${acroHits.map(([a,e])=>`<div class="search-hit" onclick="showPage('acro');setTimeout(()=>{const i=document.querySelector('#acroSearch');if(i){i.value='${a.replace(/'/g,"\\'")}';filterAcro(i.value)}},150)"><strong>${escapeHtml(a)}</strong><p>${escapeHtml(e)}</p></div>`).join('')}`:''}
    ${!cardHits.length&&!glossHits.length&&!acroHits.length?'<p class="muted" style="padding:30px;text-align:center">No matches.</p>':''}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* -------- THEME / EXPAND / RESET -------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('ccna_theme', next); }catch(e){}
}
function expandAllCards(){
  $$('.page.active .card').forEach(c=>c.classList.add('open'));
  $$('.page.active details').forEach(d=>d.open=true);
}
async function resetProgress(){
  if(!confirm('Reset ALL progress (cards, quiz scores, study plan, streak, mock exam history)? This cannot be undone.')) return;
  STATE.progress = {
    cardsOpened:{}, cardsDone:{}, weeksProgress:{},
    domainScores:{D1:{c:0,t:0},D2:{c:0,t:0},D3:{c:0,t:0},D4:{c:0,t:0},D5:{c:0,t:0},D6:{c:0,t:0}},
    quizTotal:{c:0,t:0}, bestExam:0,
    lastVisit:todayStr(), streak:1
  };
  STATE.quiz=null; STATE.exam=null;
  await saveProgress();
  buildTabs(); showPage('home');
}

/* -------- SCROLL PROGRESS -------- */
function initScroll(){
  const bar = $('#progress');
  if(!bar) return;
  window.addEventListener('scroll',()=>{
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = max>0 ? (h.scrollTop/max*100)+'%' : '0%';
  });
}

/* -------- INIT -------- */
async function init(){
  await loadProgress();
  await updateStreak();
  try{ const t = localStorage.getItem('ccna_theme'); if(t==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  buildPagesShell();
  buildTabs();
  initScroll();
  // wire header
  $('#logoHome').addEventListener('click',()=>showPage('home'));
  $('#search').addEventListener('input',e=>globalSearch(e.target.value));
  $('#streakBtn').addEventListener('click',()=>{
    alert(`🔥 Daily Study Streak: ${STATE.progress.streak} day${STATE.progress.streak===1?'':'s'}\n\nKeep coming back daily — even 10 minutes — to grow your streak. A study session protects the streak (any chapter view counts).`);
  });
  $('#expandAll').addEventListener('click', expandAllCards);
  $('#theme').addEventListener('click', toggleTheme);
  // double-click logo for reset
  let logoClicks=0, logoTimer;
  $('#logoHome').addEventListener('dblclick',()=>{ resetProgress(); });
  // keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && !['INPUT','TEXTAREA'].includes(e.target.tagName)){
      e.preventDefault(); $('#search').focus();
    }
    if(e.key==='Escape' && $('#page-search').classList.contains('active')){
      $('#search').value=''; showPage('home');
    }
  });
  showPage('home');
}
document.addEventListener('DOMContentLoaded', init);

</script>
