<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNA Master Class v2 — Exam-Domain Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f141d; --card:#141b26; --card2:#1a2330;
  --line:#222d3b; --line2:#2f3d4e;
  --txt:#e2e8f0; --dim:#94a3b8; --faint:#5b6b7d;
  --teal:#2dd4bf; --amber:#fbbf24; --blue:#60a5fa; --pink:#f472b6; --green:#4ade80; --red:#f87171; --violet:#a78bfa;
  --code-bg:#070b10;
  --d1:#2dd4bf; --d2:#60a5fa; --d3:#a78bfa; --d4:#fbbf24; --d5:#f472b6; --d6:#4ade80;
}
html[data-theme="light"]{
  --bg:#f5f7fa; --bg2:#eaeef3; --card:#ffffff; --card2:#f7f9fb;
  --line:#dce2e9; --line2:#c5cdd7;
  --txt:#16202c; --dim:#5a6b7d; --faint:#8a98a8;
  --teal:#0d9488; --amber:#b45309; --blue:#2563eb; --pink:#be185d; --green:#15803d; --red:#dc2626; --violet:#7c3aed;
  --code-bg:#0d1620;
  --d1:#0d9488; --d2:#2563eb; --d3:#7c3aed; --d4:#b45309; --d5:#be185d; --d6:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);
  line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased}
::selection{background:var(--teal);color:var(--bg)}

#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
  background:linear-gradient(90deg,var(--teal),var(--blue),var(--violet))}

header{position:sticky;top:0;z-index:200;background:rgba(10,14,20,.85);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
html[data-theme="light"] header{background:rgba(245,247,250,.85)}
.head-inner{max-width:1200px;margin:0 auto;padding:13px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.5px;white-space:nowrap;cursor:pointer}
.logo span{color:var(--teal)}
.logo small{display:block;font-size:9.5px;font-weight:500;color:var(--faint);
  letter-spacing:2.5px;text-transform:uppercase;margin-top:-2px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--txt);padding:9px 12px 9px 36px;border-radius:10px;
  font-family:'Sora',sans-serif;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--teal)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--faint)}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
  padding:9px 13px;border-radius:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.5px;transition:.15s;white-space:nowrap}
.hbtn:hover{border-color:var(--teal);color:var(--teal)}
.hbtn.streak{color:var(--amber);border-color:rgba(251,191,36,.3)}

.tabs{max-width:1200px;margin:0 auto;padding:10px 26px 0;
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:500;
  white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.active{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:600}
.tab .pct{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.7}

main{max-width:1200px;margin:0 auto;padding:26px 26px 100px}

/* chapter heading */
.chapter{margin-bottom:14px}
.chapter-title{display:flex;align-items:center;gap:14px;margin:34px 0 6px;scroll-margin-top:130px}
.chapter-title .cnum{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;
  color:var(--bg);background:var(--teal);padding:5px 10px;border-radius:8px}
.chapter-title h2{font-size:23px;font-weight:700;letter-spacing:-.5px}
.chapter-blurb{color:var(--dim);font-size:13.5px;margin:0 0 14px 2px;max-width:760px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:11px;overflow:hidden;transition:border-color .15s;position:relative}
.card:hover{border-color:var(--line2)}
.card.open{border-color:var(--teal)}
.card.done::after{content:"✓";position:absolute;top:14px;right:48px;width:20px;height:20px;
  border-radius:50%;background:var(--green);color:var(--bg);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.card-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.card-ico{width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--card2);border:1px solid var(--line)}
.card-head h3{flex:1;font-size:16.5px;font-weight:600;letter-spacing:-.3px}
.card-head .sub{font-size:12px;color:var(--faint);font-weight:400;display:block;margin-top:1px}
.card-chev{width:20px;height:20px;stroke:var(--faint);transition:.3s;flex-shrink:0}
.card.open .card-chev{transform:rotate(180deg);stroke:var(--teal)}
.card-body{display:none;padding:0 20px 22px;animation:fade .3s ease}
.card.open .card-body{display:block}
.card-mark{position:absolute;bottom:14px;right:20px;background:transparent;border:1px solid var(--line);
  color:var(--faint);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:10.5px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.5px;transition:.15s}
.card-mark:hover{border-color:var(--green);color:var(--green)}
.card.done .card-mark{background:rgba(74,222,128,.1);border-color:var(--green);color:var(--green)}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.card-body>*:first-child{margin-top:4px}

/* body content */
p.b{margin:10px 0;font-size:14px;color:var(--txt)}
.lead{font-size:14.5px;color:var(--txt);margin:6px 0 14px;
  padding-left:14px;border-left:2px solid var(--teal)}
h4{font-size:14px;font-weight:600;margin:18px 0 7px;color:var(--txt);
  display:flex;align-items:center;gap:8px}
h4 .dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
ul.l,ol.l{margin:6px 0 12px;padding-left:0;list-style:none}
ul.l li,ol.l li{position:relative;padding:4px 0 4px 24px;font-size:13.8px}
ul.l li::before{content:"";position:absolute;left:6px;top:11px;width:6px;height:6px;
  border-radius:50%;background:var(--teal);opacity:.7}
ol.l{counter-reset:c}
ol.l li{counter-increment:c;padding-left:30px}
ol.l li::before{content:counter(c);position:absolute;left:0;top:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--teal);background:var(--card2);border:1px solid var(--line);
  width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center}
strong{font-weight:600;color:var(--txt)}
.card-body em{font-style:normal;color:var(--amber);font-weight:500}

.analogy{background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(96,165,250,.05));
  border:1px solid var(--line2);border-radius:12px;padding:15px 18px 15px 52px;
  margin:14px 0;position:relative;font-family:'Newsreader',serif;font-size:15.5px;
  line-height:1.6;color:var(--txt)}
.analogy::before{content:"🧠";position:absolute;left:16px;top:14px;font-size:20px}
.analogy .tag{font-family:'Sora',sans-serif;display:block;font-size:9.5px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--violet);margin-bottom:5px}

.example{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:0 12px 12px 0;padding:13px 16px;margin:14px 0}
.example .tag{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--blue);margin-bottom:6px;display:block}
.example p{font-size:13.6px;margin:5px 0}

.code{background:var(--code-bg);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin:13px 0;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.85;color:#a8efe2;overflow-x:auto}
.code .p{color:var(--amber);user-select:none}
.code .c{color:#5b6b7d;font-style:italic}
.code .k{color:var(--pink)}
.code .n{color:var(--amber)}
html[data-theme="light"] .code{color:#86efe0}

.tw{overflow-x:auto;margin:13px 0;border:1px solid var(--line);border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{background:var(--bg2);text-align:left;padding:10px 13px;font-size:10px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:var(--teal);border-bottom:1px solid var(--line)}
td{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top}
td:first-child{color:var(--txt);font-weight:500}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card2)}
td code,p code,li code{background:var(--code-bg);padding:1px 6px;border-radius:5px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8fe6d8}
html[data-theme="light"] td code,html[data-theme="light"] p code,html[data-theme="light"] li code{color:#0d7d70}

.note{display:flex;gap:11px;border-radius:11px;padding:12px 16px;margin:13px 0;font-size:13.4px;
  background:var(--card2);border:1px solid var(--line)}
.note .i{font-size:16px;flex-shrink:0;line-height:1.4}
.note.tip{border-left:3px solid var(--green)} .note.tip b{color:var(--green)}
.note.warn{border-left:3px solid var(--amber)} .note.warn b{color:var(--amber)}
.note.key{border-left:3px solid var(--teal)} .note.key b{color:var(--teal)}
.note.exam{border-left:3px solid var(--pink)} .note.exam b{color:var(--pink)}

.terms{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.term{background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;font-size:12px;max-width:100%}
.term b{color:var(--teal);font-weight:600}
.term span{color:var(--dim)}

.mnemonic{text-align:center;font-family:'Newsreader',serif;font-style:italic;
  font-size:16px;color:var(--amber);background:rgba(251,191,36,.06);
  border:1px dashed rgba(251,191,36,.4);border-radius:11px;padding:13px;margin:13px 0}

.hide{display:none!important}
.no-match{text-align:center;color:var(--faint);padding:40px;font-size:14px}

/* page system */
.page{display:none}
.page.active{display:block;animation:pageIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.page-head .pico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:24px;background:var(--card2);border:1px solid var(--line);flex-shrink:0}
.page-head .pnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);
  font-weight:600;letter-spacing:1px}
.page-head h2{font-size:26px;font-weight:700;letter-spacing:-.5px}
.page-blurb{color:var(--dim);font-size:14px;margin:0 0 20px 0;max-width:760px}

.pagenav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;
  padding-top:22px;border-top:1px solid var(--line)}
.pagenav button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:14px 18px;cursor:pointer;text-align:left;transition:.15s;max-width:48%;
  font-family:'Sora',sans-serif}
.pagenav button:hover:not(:disabled){border-color:var(--teal);transform:translateY(-2px)}
.pagenav button:disabled{opacity:.3;cursor:default}
.pagenav button.next{text-align:right}
.pagenav button .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--faint);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.pagenav button .ttl{font-weight:600;font-size:14px}

/* home */
.home-hero{background:radial-gradient(130% 150% at 0% 0%,var(--card2),var(--card) 58%);
  border:1px solid var(--line);border-radius:20px;padding:38px 36px;margin-bottom:26px;
  position:relative;overflow:hidden}
.home-hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:320px;height:320px;
  background:radial-gradient(circle,var(--teal),transparent 68%);opacity:.12}
.home-hero h1{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.08;margin-bottom:12px}
.home-hero h1 .g{background:linear-gradient(120deg,var(--teal),var(--blue));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.home-hero p{color:var(--dim);font-size:15px;max-width:620px;position:relative;z-index:1}
.home-cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1}
.home-cta button{background:var(--teal);color:var(--bg);border:none;border-radius:11px;
  padding:13px 22px;font-family:'Sora',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.home-cta button:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px var(--teal)}
.home-cta button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2)}

/* progress dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 24px}
.dash-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.dash-tile .dlbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.dash-tile .dval{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.dash-tile .dval.teal{color:var(--teal)}
.dash-tile .dval.amber{color:var(--amber)}
.dash-tile .dval.green{color:var(--green)}
.dash-tile .dsub{font-size:11.5px;color:var(--dim);margin-top:5px}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;margin:8px 0}
.home-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.home-tile:hover{border-color:var(--teal);transform:translateY(-3px)}
.home-tile .tnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint)}
.home-tile .tico{font-size:26px;margin:4px 0 8px}
.home-tile h3{font-size:15.5px;font-weight:600;margin-bottom:4px}
.home-tile p{font-size:12.5px;color:var(--dim);line-height:1.5}
.home-tile .badge{position:absolute;top:14px;right:14px;font-size:9px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:var(--bg);background:var(--amber);
  padding:3px 7px;border-radius:6px}
.home-tile .tpct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);
  margin-top:8px;font-weight:600}

.domain-bars{margin:14px 0}
.dbar{display:flex;align-items:center;gap:12px;margin-bottom:9px;cursor:pointer;
  padding:6px;border-radius:8px;transition:.15s}
.dbar:hover{background:var(--card2)}
.dbar .dname{font-size:13px;width:240px;flex-shrink:0}
.dbar .dname .dweight{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);margin-left:6px}
.dbar .dtrack{flex:1;height:9px;background:var(--card2);border-radius:6px;overflow:hidden}
.dbar .dfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .4s}
.dbar.d1 .dfill{background:linear-gradient(90deg,var(--d1),var(--d2))}
.dbar.d2 .dfill{background:linear-gradient(90deg,var(--d2),var(--d3))}
.dbar.d3 .dfill{background:linear-gradient(90deg,var(--d3),var(--d4))}
.dbar.d4 .dfill{background:linear-gradient(90deg,var(--d4),var(--d5))}
.dbar.d5 .dfill{background:linear-gradient(90deg,var(--d5),var(--d6))}
.dbar.d6 .dfill{background:linear-gradient(90deg,var(--d6),var(--d1))}
.dbar .dpct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);width:42px;text-align:right;font-weight:600}

.section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--faint);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* study plan */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.week{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.week.done{border-color:var(--green)}
.week.current{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.week-num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--teal);font-weight:600}
.week-title{font-size:17px;font-weight:700;margin:4px 0 8px;letter-spacing:-.3px}
.week-hours{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);margin-bottom:12px}
.week-tasks{list-style:none;padding:0}
.week-tasks li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.week-tasks li .chk{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;transition:.15s}
.week-tasks li.done .chk{background:var(--green);border-color:var(--green);color:var(--bg)}
.week-tasks li.done{color:var(--faint);text-decoration:line-through}
.week-progress{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:12px}
.week-progress .wp-fill{height:100%;background:var(--teal);transition:width .3s}

/* subnet trainer */
.subnet-shell{max-width:680px;margin:0 auto}
.subnet-q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:18px}
.subnet-q .stype{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.subnet-q .sip{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;
  color:var(--teal);margin:6px 0 14px;letter-spacing:.5px}
.subnet-q .sprompt{font-size:14.5px;color:var(--txt);margin-bottom:14px}
.subnet-answer{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.subnet-answer input{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:11px 14px;border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:14px;
  width:180px;outline:none}
.subnet-answer input:focus{border-color:var(--teal)}
.subnet-feedback{padding:14px;border-radius:11px;margin-top:12px;font-size:13.5px;display:none}
.subnet-feedback.show{display:block}
.subnet-feedback.right{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.subnet-feedback.wrong{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.subnet-feedback .steps{margin-top:10px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7}
.subnet-stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.subnet-stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.subnet-stat .v{font-size:18px;font-weight:700;color:var(--teal)}
.subnet-stat .l{font-size:10px;color:var(--faint);letter-spacing:1px;text-transform:uppercase}

/* quiz */
.quiz-shell{max-width:680px;margin:0 auto}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quiz-progress .qtrack{flex:1;height:7px;background:var(--card2);border-radius:5px;overflow:hidden}
.quiz-progress .qfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));
  border-radius:5px;transition:width .3s}

<script>
/* ============================================================
   CONTENT — chapters organized by official CCNA 200-301 v1.1 exam domains
   D1 Network Fundamentals (20%) · D2 Network Access (20%) · D3 IP Connectivity (25%)
   D4 IP Services (10%) · D5 Security (15%) · D6 Automation (10%)
   ============================================================ */
const CH = [
/* ============================================================
   DOMAIN 1 — NETWORK FUNDAMENTALS (20% of exam)
   ============================================================ */
{id:"d1", name:"D1 · Network Fundamentals", icon:"🌐", domain:"1", weight:20,
 blurb:"How networks are built and how data moves. Models, devices, addressing, cabling — the foundation everything else stands on.",
 cards:[
  {ico:"📚",title:"The OSI Model",sub:"7 layers · how data is built and torn down",
   html:`
   <div class="lead">The OSI model is a 7-layer framework that describes how data travels from an application on one computer, across a network, to an application on another. Each layer has one job and talks only to the layers directly above and below it.</div>
   <div class="analogy"><span class="tag">Analogy — Sending a letter</span>You write a letter (Layer 7 data). You put it in an envelope and address it (Layer 3 — IP). The post office sorts it by region and hands it to a truck (Layer 2 — local delivery). The truck drives the physical roads (Layer 1 — wires). At the destination, each step is reversed: the truck arrives, the local office routes it, the envelope is opened, the recipient reads the letter. Every layer "wraps" the data on the way out and "unwraps" it on the way in.</div>
   <h4><span class="dot"></span>The seven layers (top to bottom)</h4>
   <div class="tw"><table><thead><tr><th>#</th><th>Layer</th><th>Job</th><th>Lives here</th><th>Data unit</th></tr></thead><tbody>
   <tr><td>7</td><td>Application</td><td>The interface to the user / app</td><td>HTTP, DNS, FTP, SMTP</td><td>Data</td></tr>
   <tr><td>6</td><td>Presentation</td><td>Formatting, encryption, compression</td><td>SSL/TLS, JPEG, ASCII</td><td>Data</td></tr>
   <tr><td>5</td><td>Session</td><td>Starts/maintains/ends conversations</td><td>RPC, NetBIOS</td><td>Data</td></tr>
   <tr><td>4</td><td>Transport</td><td>Reliable vs fast delivery, ports</td><td>TCP, UDP</td><td>Segment</td></tr>
   <tr><td>3</td><td>Network</td><td>Logical addressing &amp; routing</td><td>IP, ICMP, routers</td><td>Packet</td></tr>
   <tr><td>2</td><td>Data Link</td><td>Physical addressing on local link</td><td>Ethernet, MAC, switches</td><td>Frame</td></tr>
   <tr><td>1</td><td>Physical</td><td>The actual bits on the medium</td><td>Cables, fiber, radio</td><td>Bits</td></tr>
   </tbody></table></div>
   <div class="mnemonic">Layer 7→1: "All People Seem To Need Data Processing"<br>Layer 1→7: "Please Do Not Throw Sausage Pizza Away"</div>
   <h4><span class="dot"></span>Encapsulation — the key idea</h4>
   <p class="b">As data moves <em>down</em> the stack, each layer adds its own header (and L2 adds a trailer too). This wrapping is called <strong>encapsulation</strong>. Going <em>up</em> the stack at the receiver, each header is stripped off — <strong>de-encapsulation</strong>.</p>
   <div class="example"><span class="tag">Worked example — loading a web page</span>
   <p>Your browser creates an HTTP request (L7). TCP wraps it with port 443 + sequence numbers (L4 → segment). IP wraps that with your IP and the server's IP (L3 → packet). Ethernet wraps that with your NIC's MAC and the gateway's MAC (L2 → frame). The NIC turns it into electrical/optical signals (L1 → bits). The server reverses every step.</p></div>
   <div class="note exam"><span class="i">🎯</span><div><b>Exam trap:</b> They love asking "at which layer does a router/switch operate?" Router = L3 (IP). Switch = L2 (MAC). Hub = L1 (dumb signal repeater). And "what PDU exists at L4?" = Segment.</div></div>`},

  {ico:"🔗",title:"TCP/IP Model",sub:"The 4-layer model the internet actually uses",
   html:`
   <div class="lead">OSI is the teaching model. The real internet runs on the TCP/IP model, which collapses OSI's 7 layers into 4. Same concepts, fewer boxes.</div>
   <div class="tw"><table><thead><tr><th>TCP/IP Layer</th><th>Maps to OSI</th><th>Examples</th></tr></thead><tbody>
   <tr><td>Application</td><td>7, 6, 5</td><td>HTTP, DNS, FTP, SSH</td></tr>
   <tr><td>Transport</td><td>4</td><td>TCP, UDP</td></tr>
   <tr><td>Internet</td><td>3</td><td>IP, ICMP, ARP</td></tr>
   <tr><td>Network Access (Link)</td><td>2, 1</td><td>Ethernet, Wi-Fi, cables</td></tr>
   </tbody></table></div>
   <div class="note key"><span class="i">🔑</span><div><b>Why both exist:</b> OSI gives you precise vocabulary ("that's a Layer 2 problem"). TCP/IP describes what's really running. The exam uses both interchangeably, so know the mapping cold.</div></div>`},

  {ico:"📡",title:"Network Device Roles — The Full Cast",sub:"Routers, switches, firewalls, APs, WLCs, IPS, endpoints",
   html:`
   <div class="lead">The CCNA expects you to identify every device on a network diagram and know what layer it works at, what problem it solves, and where it belongs.</div>
   <div class="tw"><table><thead><tr><th>Device</th><th>Layer</th><th>What it does</th></tr></thead><tbody>
   <tr><td><strong>Router</strong></td><td>L3</td><td>Forwards packets between networks by IP. Blocks broadcasts.</td></tr>
   <tr><td><strong>Switch (L2)</strong></td><td>L2</td><td>Forwards frames by MAC within a LAN. Builds MAC table by learning source MACs.</td></tr>
   <tr><td><strong>Multilayer (L3) Switch</strong></td><td>L2 + L3</td><td>Switches inside VLANs, routes between them via SVIs. Cores of campus networks.</td></tr>
   <tr><td><strong>Hub</strong></td><td>L1</td><td>Dumb signal repeater. Floods everything. Obsolete.</td></tr>
   <tr><td><strong>Firewall</strong></td><td>L3–L7</td><td>Stateful traffic filter, separates trust zones. NGFWs add app awareness + IPS.</td></tr>
   <tr><td><strong>IPS</strong></td><td>L3–L7</td><td>Inline; inspects and <em>blocks</em> attacks.</td></tr>
   <tr><td><strong>IDS</strong></td><td>L3–L7</td><td>Out-of-band on a SPAN port; <em>alerts</em> only.</td></tr>
   <tr><td><strong>Access Point (AP)</strong></td><td>L1/L2</td><td>Bridges Wi-Fi clients to wired network. Lightweight APs depend on a WLC.</td></tr>
   <tr><td><strong>WLC</strong></td><td>L2–L7</td><td>Central brain for lightweight APs (config, RF, security via CAPWAP).</td></tr>
   <tr><td><strong>Endpoints</strong></td><td>L7</td><td>PCs, phones, printers, IoT — the things actually using the network.</td></tr>
   <tr><td><strong>Server</strong></td><td>L7</td><td>Delivers services — DNS, DHCP, AD, file, web, app.</td></tr>
   <tr><td><strong>Controller (SDN)</strong></td><td>Plane sep.</td><td>Centralized brain (e.g. Catalyst Center / DNA Center) pushing intent to devices.</td></tr>
   </tbody></table></div>
   <div class="note exam"><span class="i">🎯</span><div><b>Diagram trap:</b> Two switches connected, with a router on top of both — that's a "router on a stick" or distribution-router setup. Routers always sit where networks must be SEPARATED (subnets, VLANs, broadcast domains). Switches sit where they must be CONNECTED.</div></div>`},

  {ico:"🚦",title:"TCP vs UDP",sub:"Reliable vs fast · the Layer 4 choice",
   html:`
   <div class="lead">Layer 4 has exactly two main protocols. TCP is reliable but slower. UDP is fast but offers no guarantees. The exam tests this contrast endlessly.</div>
   <div class="tw"><table><thead><tr><th>Feature</th><th>TCP</th><th>UDP</th></tr></thead><tbody>
   <tr><td>Connection</td><td>Connection-oriented (3-way handshake)</td><td>Connectionless</td></tr>
   <tr><td>Reliability</td><td>Acks &amp; retransmits</td><td>None — best effort</td></tr>
   <tr><td>Ordering</td><td>Sequence numbers reorder data</td><td>None</td></tr>
   <tr><td>Speed/overhead</td><td>Slower — 20-byte header</td><td>Faster — 8-byte header</td></tr>
   <tr><td>Use cases</td><td>HTTP/S, SSH, email, file transfer</td><td>VoIP, video, DNS query, DHCP, TFTP</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>TCP three-way handshake</h4>
   <ol class="l"><li>Client → Server: <strong>SYN</strong> (let's talk, here's my seq #)</li><li>Server → Client: <strong>SYN-ACK</strong> (ok, here's mine, I ack yours)</li><li>Client → Server: <strong>ACK</strong> (great, connection open)</li></ol>
   <p class="b">Teardown is a 4-step <strong>FIN/ACK</strong> exchange — either side can initiate.</p>
   <div class="analogy"><span class="tag">Analogy</span>TCP is a phone call — both parties confirm they're on the line before talking. UDP is a postcard — you write it, drop it, and hope it arrives.</div>
   <div class="note exam"><span class="i">🎯</span><div><b>Why VoIP uses UDP:</b> A retransmitted voice packet would arrive too late to play. Speed and predictable jitter beat perfect delivery.</div></div>`},

  {ico:"🔍",title:"ARP — Finding MAC Addresses",sub:"How IP and MAC work together",
   html:`
   <div class="lead">ARP bridges Layer 3 (IP) and Layer 2 (MAC). Before a host can send a frame on its local network, it needs the destination MAC. ARP finds it.</div>
   <h4><span class="dot"></span>The process</h4>
   <ol class="l">
   <li>Host A wants to send to IP 10.0.0.5. It checks its ARP cache for that IP's MAC.</li>
   <li>No entry → <strong>ARP request</strong>: a Layer 2 <em>broadcast</em> ("who has 10.0.0.5?")</li>
   <li>The owner of 10.0.0.5 replies with a <strong>unicast</strong> containing its MAC.</li>
   <li>Host A caches the IP→MAC binding and sends the frame.</li>
   </ol>
   <h4><span class="dot"></span>Off-subnet destinations</h4>
   <p class="b">If the destination IP is in a different subnet, the host ARPs for its <strong>default gateway's</strong> MAC instead. The IP stays the same end-to-end, but MAC addresses are rewritten at every router hop.</p>
   <div class="note key"><span class="i">🔑</span><div><b>Verify on Cisco:</b> <code>show ip arp</code>. On Windows: <code>arp -a</code>. ARP poisoning is mitigated by <strong>Dynamic ARP Inspection (DAI)</strong>.</div></div>`},

  {ico:"🧬",title:"Ethernet, MAC Addresses & Frames",sub:"What's actually on the wire at Layer 2",
   html:`
   <div class="lead">Ethernet is the dominant LAN technology. Every frame has a MAC source, MAC destination, type field, payload, and a checksum (FCS).</div>
   <h4><span class="dot"></span>MAC address anatomy</h4>
   <p class="b">A MAC is 48 bits, written as 6 hex pairs: <code>00:1A:2B:3C:4D:5E</code>. The first 24 bits are the <strong>OUI</strong> (manufacturer) and the last 24 bits are unique to the device. A burnt-in address (BIA) is what the NIC ships with.</p>
   <h4><span class="dot"></span>Frame fields you need to know</h4>
   <div class="tw"><table><thead><tr><th>Field</th><th>Size</th><th>Job</th></tr></thead><tbody>
   <tr><td>Preamble + SFD</td><td>8 B</td><td>Sync / "frame is starting"</td></tr>
   <tr><td>Dest MAC</td><td>6 B</td><td>Who it's going to</td></tr>
   <tr><td>Source MAC</td><td>6 B</td><td>Who sent it (switch learns from this)</td></tr>
   <tr><td>Type/Length</td><td>2 B</td><td>0x0800 = IPv4, 0x86DD = IPv6, 0x0806 = ARP, 0x8100 = 802.1Q tag</td></tr>
   <tr><td>Payload</td><td>46–1500 B</td><td>The packet inside</td></tr>
   <tr><td>FCS</td><td>4 B</td><td>CRC for error detection</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Special MACs</h4>
   <ul class="l"><li><strong>FF:FF:FF:FF:FF:FF</strong> — broadcast (everyone on this segment)</li><li>Anything starting <strong>01:00:5E</strong> — IPv4 multicast</li><li>Anything starting <strong>33:33</strong> — IPv6 multicast</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Default Ethernet MTU = 1500 bytes.</b> Jumbo frames go up to ~9000. MTU mismatches break OSPF (stuck in EXSTART/EXCHANGE).</div></div>`},

  {ico:"🔌",title:"Cabling, Connectors & Ethernet Standards",sub:"UTP categories, fiber types, T568A/B, console",
   html:`
   <div class="lead">Modern Ethernet uses twisted-pair copper for short runs and fiber for long/fast runs. Knowing which to pick is exam material.</div>
   <h4><span class="dot"></span>UTP categories</h4>
   <div class="tw"><table><thead><tr><th>Category</th><th>Speed</th><th>Max distance</th><th>Use</th></tr></thead><tbody>
   <tr><td>Cat 5e</td><td>1 Gbps</td><td>100 m</td><td>Most existing LANs</td></tr>
   <tr><td>Cat 6</td><td>1 Gbps (10 Gbps short)</td><td>100 m / 55 m at 10G</td><td>New installs</td></tr>
   <tr><td>Cat 6a</td><td>10 Gbps</td><td>100 m</td><td>10G to the desk</td></tr>
   <tr><td>Cat 7/8</td><td>10–40 Gbps</td><td>shorter</td><td>Data center</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Fiber — single-mode vs multi-mode</h4>
   <ul class="l"><li><strong>Single-mode (SMF, yellow)</strong> — laser, long distance (km+), expensive. Used in WAN / building-to-building.</li><li><strong>Multi-mode (MMF, orange/aqua)</strong> — LED/VCSEL, shorter (up to ~550 m for 1G, less for 10G+), cheaper. Used inside campuses/data centers.</li></ul>
   <h4><span class="dot"></span>T568A vs T568B</h4>
   <p class="b">Both are pin-out standards for RJ-45 jacks. <strong>Same standard both ends = straight-through</strong> (PC↔switch, switch↔router). <strong>Different standards each end = crossover</strong> (switch↔switch on old gear, PC↔PC). Modern switches use <strong>auto-MDIX</strong>, which makes the cable type irrelevant.</p>
   <h4><span class="dot"></span>Special cables</h4>
   <ul class="l"><li><strong>Console (rollover) cable</strong> — light blue, RJ-45 to DB-9/USB. Used to access a device's console port (out-of-band CLI access).</li><li><strong>DAC (Direct Attach Copper)</strong> — short twinax cable with SFP/SFP+ ends, common between top-of-rack switches and servers.</li></ul>`},

  {ico:"🔌",title:"Power over Ethernet (PoE)",sub:"Powering devices through the data cable",
   html:`
   <div class="lead">PoE delivers DC power over the same UTP cable that carries data — perfect for IP phones, wireless APs, cameras, and small IoT devices.</div>
   <div class="tw"><table><thead><tr><th>Standard</th><th>Name</th><th>Max Watts (at PSE)</th><th>Typical use</th></tr></thead><tbody>
   <tr><td>802.3af</td><td>PoE</td><td>15.4 W</td><td>IP phones, basic APs</td></tr>
   <tr><td>802.3at</td><td>PoE+</td><td>30 W</td><td>Higher-power APs, PTZ cameras</td></tr>
   <tr><td>802.3bt Type 3</td><td>UPoE</td><td>60 W</td><td>Video bars, thin clients</td></tr>
   <tr><td>802.3bt Type 4</td><td>UPoE+</td><td>90–100 W</td><td>Laptops, displays</td></tr>
   </tbody></table></div>
   <p class="b">Terminology: the switch is the <strong>PSE</strong> (Power Sourcing Equipment), the powered device is the <strong>PD</strong>. The PSE negotiates power class with the PD before energizing.</p>
   <div class="note exam"><span class="i">🎯</span><div><b>Exam:</b> Know that PoE works by delivering ~48 V DC over the same pairs as data, and that AP/phone deployments depend on a PoE-capable switch (look for "PoE+" or "UPoE" in product names).</div></div>`},

  {ico:"🔢",title:"Numbering Systems: Binary, Decimal, Hex",sub:"The math everything is built on",
   html:`
   <div class="lead">IP addresses, MAC addresses, and subnet masks all come down to binary. Without comfort here, subnetting will fight you forever.</div>
   <h4><span class="dot"></span>Place values you must memorize</h4>
   <div class="mnemonic">128 · 64 · 32 · 16 · 8 · 4 · 2 · 1</div>
   <p class="b">These are the 8 bits in one octet. Set any subset, sum them — that's the decimal value. 11000000 = 128+64 = 192. 11111111 = 255.</p>
   <h4><span class="dot"></span>Hex</h4>
   <p class="b">Hex is base-16. One hex digit = 4 bits. <code>0xFF</code> = 11111111 = 255. <code>0xC0</code> = 11000000 = 192. MAC addresses are written in hex; IPv6 is entirely hex.</p>
   <div class="example"><span class="tag">Decimal → binary quick method</span>
   <p>Convert 217 to binary: 217 ≥ 128 → 1, remainder 89. 89 ≥ 64 → 1, remainder 25. 25 ≥ 16 → 0 (skip 32, take 16), remainder 9. 9 ≥ 8 → 1, remainder 1. 1 ≥ 1 → 1. Result: <code>11011001</code>.</p></div>`},

  {ico:"🏷️",title:"IPv4 Address Classes & Special Addresses",sub:"Classes A-E · private · APIPA · loopback · reserved",
   html:`
   <div class="lead">Classes are mostly historical — CIDR replaced them — but the ranges still appear on the exam.</div>
   <div class="tw"><table><thead><tr><th>Class</th><th>Range</th><th>Default mask</th><th>Notes</th></tr></thead><tbody>
   <tr><td>A</td><td>1.0.0.0 – 126.255.255.255</td><td>/8</td><td>Big networks (rare)</td></tr>
   <tr><td>B</td><td>128.0.0.0 – 191.255.255.255</td><td>/16</td><td>Medium</td></tr>
   <tr><td>C</td><td>192.0.0.0 – 223.255.255.255</td><td>/24</td><td>Small (most home/SMB)</td></tr>
   <tr><td>D</td><td>224.0.0.0 – 239.255.255.255</td><td>—</td><td>Multicast</td></tr>
   <tr><td>E</td><td>240.0.0.0 – 255.255.255.255</td><td>—</td><td>Reserved/experimental</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Private IP ranges (RFC 1918)</h4>
   <ul class="l"><li><strong>10.0.0.0/8</strong> — Class A private (huge: ~16M addresses)</li><li><strong>172.16.0.0/12</strong> — Class B private (172.16.0.0 – 172.31.255.255)</li><li><strong>192.168.0.0/16</strong> — Class C private (most home routers)</li></ul>
   <h4><span class="dot"></span>Other reserved addresses</h4>
   <ul class="l"><li><strong>127.0.0.0/8</strong> — loopback (127.0.0.1 is "this device")</li><li><strong>169.254.0.0/16</strong> — APIPA (DHCP failed; link-local only)</li><li><strong>0.0.0.0</strong> — "this host / any" (default routes)</li><li><strong>255.255.255.255</strong> — limited broadcast (this subnet only, never routed)</li><li><strong>224.0.0.0/4</strong> — multicast (224.0.0.5 = OSPF all routers; 224.0.0.18 = VRRP)</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Tell at a glance:</b> 10.x = private. 172.16-31.x = private. 192.168.x = private. 169.254.x = DHCP failed. 127.x = loopback. Everything else = public (routable).</div></div>`},

  {ico:"🔢",title:"Well-Known Port Numbers",sub:"The ports you MUST memorize",
   html:`
   <div class="lead">Ports are L4 (TCP/UDP) labels that tell the OS which app receives each segment. Memorize these or expect to be punished by the exam.</div>
   <div class="tw"><table><thead><tr><th>Port</th><th>Protocol</th><th>TCP/UDP</th><th>What</th></tr></thead><tbody>
   <tr><td>20 / 21</td><td>FTP data / control</td><td>TCP</td><td>File transfer</td></tr>
   <tr><td>22</td><td>SSH</td><td>TCP</td><td>Secure CLI access (use this, not telnet)</td></tr>
   <tr><td>23</td><td>Telnet</td><td>TCP</td><td>Cleartext CLI access (avoid)</td></tr>
   <tr><td>25</td><td>SMTP</td><td>TCP</td><td>Send email</td></tr>
   <tr><td>53</td><td>DNS</td><td>UDP (queries) / TCP (transfers)</td><td>Name resolution</td></tr>
   <tr><td>67 / 68</td><td>DHCP server / client</td><td>UDP</td><td>Auto IP assignment</td></tr>
   <tr><td>69</td><td>TFTP</td><td>UDP</td><td>Simple file transfer (IOS upgrades)</td></tr>
   <tr><td>80</td><td>HTTP</td><td>TCP</td><td>Web (cleartext)</td></tr>
   <tr><td>110</td><td>POP3</td><td>TCP</td><td>Mail download (download &amp; delete)</td></tr>
   <tr><td>123</td><td>NTP</td><td>UDP</td><td>Time sync</td></tr>
   <tr><td>143</td><td>IMAP</td><td>TCP</td><td>Mail (sync, keep on server)</td></tr>
   <tr><td>161 / 162</td><td>SNMP / SNMP trap</td><td>UDP</td><td>Network monitoring</td></tr>
   <tr><td>179</td><td>BGP</td><td>TCP</td><td>Internet routing (between ASes)</td></tr>
   <tr><td>443</td><td>HTTPS</td><td>TCP</td><td>Web encrypted (TLS)</td></tr>
   <tr><td>514</td><td>Syslog</td><td>UDP</td><td>Log shipping</td></tr>
   <tr><td>520</td><td>RIP</td><td>UDP</td><td>Legacy routing protocol</td></tr>
   </tbody></table></div>
   <div class="mnemonic">"Six Six Eight Eighty" — SSH 22, DNS 53, HTTPS 443, HTTP 80</div>`},

  {ico:"📣",title:"Traffic Types & Network Domains",sub:"Unicast · broadcast · multicast · anycast",
   html:`
   <div class="lead">Networks deliver four traffic patterns. Knowing each and the domains they cross is fundamental.</div>
   <h4><span class="dot"></span>Traffic types</h4>
   <ul class="l">
   <li><strong>Unicast</strong> — one source → one destination. Most traffic.</li>
   <li><strong>Broadcast</strong> — one source → ALL on the segment. Address 255.255.255.255 or FF:FF:FF:FF:FF:FF. ARP, DHCP Discover. Stops at routers.</li>
   <li><strong>Multicast</strong> — one source → many subscribers (group). 224.0.0.0/4. Streaming video, OSPF hellos (224.0.0.5).</li>
   <li><strong>Anycast</strong> — one address advertised from multiple places; client gets the "closest." Used in IPv6, DNS root servers, CDNs.</li>
   </ul>
   <h4><span class="dot"></span>Domains</h4>
   <ul class="l">
   <li><strong>Collision domain</strong> — where two frames can collide. Each switch port = its own. Hub = one giant one. Full-duplex switching = no collisions.</li>
   <li><strong>Broadcast domain</strong> — where broadcasts reach. One VLAN = one broadcast domain. Routers stop them.</li>
   </ul>
   <div class="example"><span class="tag">Count the domains</span><p>A 24-port switch with two VLANs: <strong>24 collision domains</strong> (one per port) and <strong>2 broadcast domains</strong> (one per VLAN).</p></div>`},

  {ico:"📶",title:"ICMP, Ping & Traceroute",sub:"The diagnostic protocol and its tools",
   html:`
   <div class="lead">ICMP is the network's diagnostic and error-reporting protocol. It runs at Layer 3 directly over IP (no TCP/UDP).</div>
   <h4><span class="dot"></span>Ping — is it reachable?</h4>
   <p class="b">Ping sends ICMP <strong>Echo Request</strong> and waits for an <strong>Echo Reply</strong>. Output meanings:</p>
   <ul class="l"><li><code>!</code> success</li><li><code>.</code> timeout (no reply received)</li><li><code>U</code> destination unreachable (ICMP message)</li><li><code>!!!!!</code> 5/5 = link works</li></ul>
   <h4><span class="dot"></span>Traceroute — what's the path?</h4>
   <p class="b">Cleverly uses <strong>TTL</strong>: sends a packet with TTL=1 (first router decrements to 0 and sends ICMP Time Exceeded → reveals hop 1), then TTL=2 (reveals hop 2), and so on. Cisco devices send UDP probes; Windows <code>tracert</code> sends ICMP.</p>
   <h4><span class="dot"></span>Common ICMP messages</h4>
   <ul class="l"><li><strong>Destination Unreachable</strong> — network/host/protocol/port unreachable</li><li><strong>Time Exceeded</strong> — TTL hit 0 (traceroute relies on this)</li><li><strong>Redirect</strong> — "better next hop available" (often disabled for security)</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Common pitfall:</b> Many firewalls drop ICMP, so a failed ping doesn't always mean a host is down. Try TCP-based tests too.</div></div>`},

  {ico:"⚡",title:"Bandwidth, Throughput & Data Units",sub:"Bits vs bytes · speeds · what the numbers mean",
   html:`
   <div class="lead">Network speeds use bits; storage uses bytes. Mixing them is the source of countless miscalculations.</div>
   <h4><span class="dot"></span>Bits vs bytes</h4>
   <ul class="l"><li>1 byte = 8 bits</li><li>kbps = kilobits per second (network speed)</li><li>KBps = kilobytes per second (download manager)</li><li>1 MB file on a 10 Mbps link → 10 ÷ 8 = 1.25 MB/s, so ~0.8 seconds (in theory)</li></ul>
   <h4><span class="dot"></span>Bandwidth vs throughput vs goodput</h4>
   <ul class="l"><li><strong>Bandwidth</strong> — the pipe's maximum capacity (1 Gbps link)</li><li><strong>Throughput</strong> — what you actually move (overhead, collisions, congestion eat into it)</li><li><strong>Goodput</strong> — useful application data only, excluding retransmissions and headers</li></ul>
   <h4><span class="dot"></span>Common speeds</h4>
   <div class="tw"><table><tbody>
   <tr><td>10 Mbps</td><td>Legacy Ethernet</td></tr>
   <tr><td>100 Mbps</td><td>Fast Ethernet</td></tr>
   <tr><td>1 Gbps</td><td>Gigabit Ethernet (standard today)</td></tr>
   <tr><td>10/40/100 Gbps</td><td>Data center / uplinks</td></tr>
   </tbody></table></div>`},

  {ico:"🖥️",title:"Verifying IP on a Host",sub:"ipconfig · ifconfig · ip · the first troubleshooting step",
   html:`
   <div class="lead">Before blaming the network, confirm the host has correct settings. This is always step one in real troubleshooting.</div>
   <h4><span class="dot"></span>Windows</h4>
   <div class="code"><span class="p">C:\\&gt;</span> ipconfig <span class="c">! basic</span><br><span class="p">C:\\&gt;</span> ipconfig /all <span class="c">! includes DNS, DHCP, MAC</span><br><span class="p">C:\\&gt;</span> ipconfig /release<br><span class="p">C:\\&gt;</span> ipconfig /renew <span class="c">! re-run DHCP</span><br><span class="p">C:\\&gt;</span> ipconfig /flushdns</div>
   <h4><span class="dot"></span>Linux / macOS</h4>
   <div class="code"><span class="p">$</span> ip addr <span class="c">! modern Linux</span><br><span class="p">$</span> ip route <span class="c">! routing table / gateway</span><br><span class="p">$</span> ifconfig <span class="c">! older / macOS</span><br><span class="p">$</span> cat /etc/resolv.conf <span class="c">! DNS servers</span></div>
   <h4><span class="dot"></span>What to check, in order</h4>
   <ol class="l"><li>Does the host have an IP, mask, and gateway? Is the gateway IN the same subnet as the IP?</li><li>169.254.x.x → DHCP failed.</li><li>Can you ping your own gateway? If yes, L1/L2 to gateway is fine.</li><li>Can you ping 8.8.8.8 (an IP)? If yes, internet works.</li><li>Can you ping google.com (a name)? If 4 works but 5 fails → <strong>DNS</strong>.</li></ol>`},

  {ico:"🩹",title:"Interface & Cable Issues",sub:"Reading error counters · collisions · CRC",
   html:`
   <div class="lead">A degraded cable, duplex mismatch, or dying NIC shows up as counters climbing on a router/switch interface. Reading them is exam material.</div>
   <h4><span class="dot"></span>Key indicators on <code>show interface</code></h4>
   <ul class="l">
   <li><strong>CRC errors / input errors</strong> — frame failed checksum → bad cable, interference, or speed/duplex mismatch.</li>
   <li><strong>Collisions</strong> — only valid on half-duplex links. On full-duplex they should be 0.</li>
   <li><strong>Late collisions</strong> — collision after 512 bits transmitted → almost always a duplex mismatch.</li>
   <li><strong>Runts</strong> — frames smaller than 64 bytes (corrupted/collided).</li>
   <li><strong>Giants</strong> — frames larger than 1518 bytes (often MTU mismatch).</li>
   <li><strong>Input drops / output drops</strong> — interface is too busy, buffer overflow.</li>
   </ul>
   <h4><span class="dot"></span>Interface states</h4>
   <ul class="l"><li><strong>up/up</strong> — operational</li><li><strong>up/down</strong> — line up but protocol down (encapsulation, keepalive, no neighbor)</li><li><strong>down/down</strong> — no signal (cable unplugged, switchport admin down on other end)</li><li><strong>administratively down/down</strong> — local <code>shutdown</code></li><li><strong>err-disabled</strong> — auto-shut by port security/BPDU Guard/etc. → <code>shutdown</code> then <code>no shutdown</code> to recover</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Duplex mismatch signature:</b> One end shows late collisions, the other shows runts and CRC errors. Both sides slow as molasses but link is "up." Set both ends to the SAME (preferably full + auto).</div></div>`},
 ]},

/* ============================================================
   DOMAIN 2 — NETWORK ACCESS (20% of exam)
   ============================================================ */
{id:"d2", name:"D2 · Network Access", icon:"🔀", domain:"2", weight:20,
 blurb:"Layer 2 — switches, VLANs, trunking, STP, EtherChannel, plus wireless. Roughly 20% of the exam.",
 cards:[
  {ico:"🧠",title:"How a Switch Learns & Forwards",sub:"MAC address table · the 3 switch functions",
   html:`
   <div class="lead">A switch does three things: learn, forward, flood. That's it. Mastering this loop explains every L2 behavior.</div>
   <h4><span class="dot"></span>The three functions</h4>
   <ol class="l"><li><strong>Learn</strong> — read every frame's <em>source</em> MAC and record it with the arrival port in the MAC table.</li><li><strong>Forward</strong> — for a known unicast destination, send the frame ONLY out the matching port.</li><li><strong>Flood</strong> — for an unknown unicast, broadcast (FFFF.FFFF.FFFF), or multicast, send out ALL ports except the one it came in on.</li></ol>
   <h4><span class="dot"></span>The MAC table</h4>
   <p class="b">Also called the CAM table. Each entry: VLAN, MAC, port, age. Default age is 300 seconds. Entries are dynamic (learned) or static (configured).</p>
   <div class="code"><span class="p">SW#</span> show mac address-table<br><span class="c">! Output:</span><br>Vlan&nbsp;&nbsp;&nbsp;&nbsp;Mac Address&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Type&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Ports<br>10&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0011.2233.4455&nbsp;&nbsp;DYNAMIC&nbsp;&nbsp;&nbsp;&nbsp;Fa0/3</div>
   <div class="analogy"><span class="tag">Analogy</span>A switch is a hotel concierge with a guest book. Every time a guest walks past, the concierge notes their name and which room they came from. Mail addressed to a known guest goes straight to their room. Mail for someone unknown gets shouted in every hallway.</div>
   <div class="note exam"><span class="i">🎯</span><div><b>Critical:</b> Learning is from SOURCE MAC; forwarding decisions use DESTINATION MAC. Don't mix those up.</div></div>`},

  {ico:"🏷️",title:"VLANs — Virtual LANs",sub:"Slicing one switch into many networks",
   html:`
   <div class="lead">A VLAN is a logical broadcast domain inside a switch. Ports in different VLANs cannot reach each other without a Layer 3 device, even on the same switch.</div>
   <h4><span class="dot"></span>Why VLANs exist</h4>
   <ul class="l"><li>Separate traffic (HR from Engineering) without buying separate switches</li><li>Shrink broadcast domains for performance</li><li>Improve security — devices can't see traffic in other VLANs</li><li>Group users by function, not by physical location</li></ul>
   <h4><span class="dot"></span>Port types</h4>
   <ul class="l">
   <li><strong>Access port</strong> — one VLAN, connects an end device, frames untagged on the wire.</li>
   <li><strong>Trunk port</strong> — many VLANs, connects switch-to-switch, frames carry 802.1Q VLAN tags.</li>
   </ul>
   <h4><span class="dot"></span>Configuration</h4>
   <div class="code"><span class="p">SW(config)#</span> vlan 10<br><span class="p">SW(config-vlan)#</span> name SALES<br><span class="p">SW(config-vlan)#</span> exit<br><span class="p">SW(config)#</span> interface fa0/3<br><span class="p">SW(config-if)#</span> switchport mode access<br><span class="p">SW(config-if)#</span> switchport access vlan 10<br><br><span class="p">SW#</span> show vlan brief<br><span class="p">SW#</span> show interface fa0/3 switchport</div>
   <div class="note exam"><span class="i">🎯</span><div><b>Rules:</b> VLAN 1 is the default. VLAN 1002–1005 are reserved (Token Ring/FDDI). Range 2–1001 is "normal", 1006–4094 "extended" (needs VTP transparent or off).</div></div>`},

  {ico:"🗂️",title:"VLAN Types — Voice · Native · Management · Default",sub:"What each VLAN is for · ranges",
   html:`
   <div class="lead">Beyond plain data VLANs, the exam expects you to know the four named special-purpose VLANs and the numbering ranges.</div>
   <div class="tw"><table><thead><tr><th>VLAN type</th><th>Purpose</th></tr></thead><tbody>
   <tr><td><strong>Data VLAN</strong></td><td>Normal user traffic — one per department/floor.</td></tr>
   <tr><td><strong>Voice VLAN</strong></td><td>IP phone traffic, tagged separately so QoS can prioritize it. Configured on a port with <code>switchport voice vlan 20</code>. The same port also carries data untagged for a PC daisy-chained behind the phone.</td></tr>
   <tr><td><strong>Native VLAN</strong></td><td>The one VLAN on a trunk that travels <em>untagged</em>. Default is VLAN 1. Both trunk ends MUST agree or CDP will scream.</td></tr>
   <tr><td><strong>Management VLAN</strong></td><td>Used for admin access (SSH, SNMP) to the switch. Best practice: NOT VLAN 1, separate subnet, ACL-limited.</td></tr>
   <tr><td><strong>Default VLAN</strong></td><td>VLAN 1, where all ports start.</td></tr>
   <tr><td><strong>Black-hole VLAN</strong></td><td>An unused VLAN assigned to disabled ports so a malicious user plugging in finds an isolated dead end.</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>VLAN ranges</h4>
   <ul class="l"><li><strong>0, 4095</strong> — reserved, never use</li><li><strong>1</strong> — default, also reserved</li><li><strong>2–1001</strong> — normal range</li><li><strong>1002–1005</strong> — reserved (Token Ring/FDDI legacy)</li><li><strong>1006–4094</strong> — extended range</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Best practice:</b> Don't use VLAN 1 for user data or management. Change the native VLAN on trunks to an unused VLAN ID. Both prevent VLAN-hopping attacks.</div></div>`},

  {ico:"🛣️",title:"Trunking & 802.1Q",sub:"Carrying many VLANs over one link",
   html:`
   <div class="lead">A trunk port lets a single physical link carry frames for many VLANs by tagging each frame with its VLAN ID — except the native VLAN, which crosses untagged.</div>
   <h4><span class="dot"></span>802.1Q frame format</h4>
   <p class="b">802.1Q inserts a 4-byte tag between the source MAC and the EtherType field of an Ethernet frame. The tag contains the VLAN ID (12 bits → 4094 usable VLANs) and a 3-bit PCP for QoS.</p>
   <h4><span class="dot"></span>Trunk configuration</h4>
   <div class="code"><span class="p">SW(config)#</span> interface gi0/1<br><span class="p">SW(config-if)#</span> switchport trunk encapsulation dot1q <span class="c">! older switches</span><br><span class="p">SW(config-if)#</span> switchport mode trunk<br><span class="p">SW(config-if)#</span> switchport trunk native vlan 99<br><span class="p">SW(config-if)#</span> switchport trunk allowed vlan 10,20,30<br><br><span class="p">SW#</span> show interfaces trunk</div>
   <h4><span class="dot"></span>DTP — Dynamic Trunking Protocol</h4>
   <p class="b">Cisco proprietary. Auto-negotiates trunking. Modes: dynamic auto, dynamic desirable, on (trunk), off (access). <strong>Disable</strong> with <code>switchport nonegotiate</code> on edge ports — DTP enabled on a user port is a VLAN-hopping attack vector.</p>
   <div class="note exam"><span class="i">🎯</span><div><b>Native VLAN mismatch:</b> CDP will log it. Different switches treat untagged frames as belonging to whichever native VLAN each thinks is configured. Always match both ends.</div></div>`},

  {ico:"🌳",title:"Spanning Tree Protocol (STP) — Basics",sub:"Stopping Layer 2 loops from melting your network",
   html:`
   <div class="lead">Layer 2 has NO loop prevention (no TTL). A switch loop creates an instant broadcast storm that floods CPUs to 100% and brings the network down. STP blocks redundant paths to prevent this while keeping them ready for failover.</div>
   <h4><span class="dot"></span>The election</h4>
   <ol class="l"><li><strong>Root bridge</strong> — switch with the LOWEST Bridge ID (priority + MAC). Default priority is 32768. Tie-breaker: lowest MAC.</li><li><strong>Root port</strong> on each non-root switch — the port with the lowest cost path TO the root.</li><li><strong>Designated port</strong> — one per segment, the side closer to the root. Forwards.</li><li>Everything else → blocked (still receives BPDUs).</li></ol>
   <h4><span class="dot"></span>Port costs (IEEE 802.1D)</h4>
   <div class="tw"><table><tbody>
   <tr><td>10 Mbps</td><td>100</td></tr>
   <tr><td>100 Mbps</td><td>19</td></tr>
   <tr><td>1 Gbps</td><td>4</td></tr>
   <tr><td>10 Gbps</td><td>2</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Influence the root election</h4>
   <div class="code"><span class="p">SW(config)#</span> spanning-tree vlan 10 root primary<br><span class="p">SW(config)#</span> spanning-tree vlan 10 root secondary<br><span class="p">SW(config)#</span> spanning-tree vlan 10 priority 4096</div>
   <div class="note key"><span class="i">🔑</span><div><b>Priority must be in multiples of 4096</b> (0, 4096, 8192…). The "root primary" macro just sets priority lower than current root.</div></div>`},

  {ico:"🌲",title:"STP Deep — Port States, RSTP, Rapid PVST+",sub:"The states, the timers, the modern flavors",
   html:`
   <div class="lead">Classic 802.1D STP takes ~30–50 s to converge. RSTP/Rapid PVST+ is essentially instant. The CCNA wants both.</div>
   <h4><span class="dot"></span>802.1D STP port states</h4>
   <div class="tw"><table><thead><tr><th>State</th><th>Forwards data?</th><th>Learns MACs?</th><th>BPDUs?</th></tr></thead><tbody>
   <tr><td>Disabled</td><td>No</td><td>No</td><td>No</td></tr>
   <tr><td>Blocking</td><td>No</td><td>No</td><td>Receives</td></tr>
   <tr><td>Listening</td><td>No</td><td>No</td><td>Receives + sends</td></tr>
   <tr><td>Learning</td><td>No</td><td>Yes</td><td>Receives + sends</td></tr>
   <tr><td>Forwarding</td><td>Yes</td><td>Yes</td><td>Receives + sends</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>RSTP port states (3 only)</h4>
   <ul class="l"><li><strong>Discarding</strong> (= old disabled/blocking/listening)</li><li><strong>Learning</strong></li><li><strong>Forwarding</strong></li></ul>
   <h4><span class="dot"></span>RSTP port roles</h4>
   <ul class="l"><li><strong>Root</strong> — best path to root</li><li><strong>Designated</strong> — forwarding on a segment</li><li><strong>Alternate</strong> — backup root port (discarding, ready to take over fast)</li><li><strong>Backup</strong> — backup designated (rare; same switch)</li></ul>
   <h4><span class="dot"></span>STP variants</h4>
   <div class="tw"><table><tbody>
   <tr><td><strong>STP / 802.1D</strong></td><td>Original, one tree for all VLANs, slow</td></tr>
   <tr><td><strong>PVST+</strong></td><td>Cisco — one tree per VLAN, still slow timers</td></tr>
   <tr><td><strong>Rapid PVST+</strong></td><td>Cisco default — per-VLAN + fast convergence</td></tr>
   <tr><td><strong>MST / 802.1s</strong></td><td>Maps many VLANs into a few instances (large environments)</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>PortFast + BPDU Guard (edge port hardening)</h4>
   <div class="code"><span class="p">SW(config-if)#</span> spanning-tree portfast<br><span class="p">SW(config-if)#</span> spanning-tree bpduguard enable</div>
   <p class="b">PortFast skips listening/learning — port goes to forwarding immediately. BPDU Guard err-disables the port if any BPDU arrives (someone plugged in a rogue switch).</p>
   <div class="note exam"><span class="i">🎯</span><div><b>BID = priority + system-id-extension (VLAN) + MAC.</b> The extended system ID lets PVST+ encode the VLAN in the BID so each VLAN has its own root.</div></div>`},

  {ico:"🪢",title:"EtherChannel",sub:"Bundling links for speed + redundancy",
   html:`
   <div class="lead">EtherChannel bundles up to 8 physical links into one logical interface (Port-channel). More bandwidth, no STP-blocked members, and survives a link failure.</div>
   <h4><span class="dot"></span>Negotiation protocols</h4>
   <ul class="l">
   <li><strong>LACP (802.3ad)</strong> — open standard. Modes: <code>active</code> (initiates), <code>passive</code> (waits). Active+active OR active+passive forms a bundle. Passive+passive does NOT.</li>
   <li><strong>PAgP</strong> — Cisco. Modes: <code>desirable</code> (initiates), <code>auto</code>. Same logic.</li>
   <li><strong>On</strong> — static, no negotiation. Both ends must be set "on" or it breaks.</li>
   </ul>
   <h4><span class="dot"></span>Configuration</h4>
   <div class="code"><span class="p">SW(config)#</span> interface range gi0/1 - 2<br><span class="p">SW(config-if-range)#</span> channel-group 1 mode active <span class="c">! LACP</span><br><span class="p">SW(config-if-range)#</span> exit<br><span class="p">SW(config)#</span> interface port-channel 1<br><span class="p">SW(config-if)#</span> switchport mode trunk<br><br><span class="p">SW#</span> show etherchannel summary</div>
   <h4><span class="dot"></span>Requirements (all must match across member ports)</h4>
   <ul class="l"><li>Same speed and duplex</li><li>Same trunk/access mode</li><li>Same allowed VLAN list and native VLAN</li><li>Same STP settings</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>LACP modes:</b> active+active ✅, active+passive ✅, passive+passive ❌, on+on ✅ (static), on+anything-else ❌.</div></div>`},

  {ico:"🛰️",title:"CDP & LLDP — Discovery Protocols",sub:"Mapping what's connected to what",
   html:`
   <div class="lead">Discovery protocols let directly-connected devices share identity info — invaluable for documenting and troubleshooting an unknown network.</div>
   <h4><span class="dot"></span>CDP (Cisco Discovery Protocol)</h4>
   <ul class="l"><li>Cisco proprietary, Layer 2, enabled by default</li><li>Sends advertisements every 60 s, holdtime 180 s</li><li>Reveals: device ID, IP, platform, IOS version, port, capabilities</li></ul>
   <div class="code"><span class="p">R1#</span> show cdp neighbors<br><span class="p">R1#</span> show cdp neighbors detail<br><span class="p">R1(config)#</span> no cdp run <span class="c">! globally off</span><br><span class="p">R1(config-if)#</span> no cdp enable <span class="c">! per-interface (untrusted)</span></div>
   <h4><span class="dot"></span>LLDP (802.1AB)</h4>
   <ul class="l"><li>Open standard, vendor-neutral</li><li>Disabled by default on Cisco; enable with <code>lldp run</code></li><li>Defaults: 30 s tx, 120 s holdtime</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>Security tip:</b> Disable CDP/LLDP on untrusted/external interfaces — they leak device info. Keep enabled on infrastructure links for ops.</div></div>`},

  {ico:"📶",title:"Wireless — APs, WLCs, CAPWAP, BSS/ESS",sub:"How Wi-Fi actually works",
   html:`
   <div class="lead">Wi-Fi is half-duplex shared media. Devices use CSMA/CA (avoid collisions because they can't detect them). One AP per channel; bigger networks use multiple APs coordinated by a controller.</div>
   <h4><span class="dot"></span>The wireless cells</h4>
   <ul class="l"><li><strong>BSS (Basic Service Set)</strong> — one AP and its associated clients. Identified by the AP's MAC (the BSSID).</li><li><strong>ESS (Extended Service Set)</strong> — multiple APs sharing the same SSID; clients roam between them.</li><li><strong>IBSS</strong> — ad-hoc, no AP. Rare.</li></ul>
   <h4><span class="dot"></span>AP architectures</h4>
   <ul class="l"><li><strong>Autonomous AP</strong> — self-contained brain. Each AP configured individually. Fine for 1–5 APs.</li><li><strong>Lightweight AP + WLC</strong> — AP holds almost no config; the Wireless LAN Controller pushes everything via CAPWAP tunnels. Standard for enterprise.</li><li><strong>Cloud-managed</strong> — Meraki-style; APs talk to a cloud controller.</li></ul>
   <h4><span class="dot"></span>CAPWAP</h4>
   <p class="b">Control And Provisioning of Wireless APs. Two UDP tunnels from AP to WLC:</p>
   <ul class="l"><li><strong>Control tunnel — UDP 5246</strong> (encrypted with DTLS by default)</li><li><strong>Data tunnel — UDP 5247</strong> (encrypted optionally)</li></ul>
   <h4><span class="dot"></span>WLC connection modes</h4>
   <div class="tw"><table><tbody>
   <tr><td><strong>Local</strong></td><td>Default. Data tunneled back to WLC (centrally inspected).</td></tr>
   <tr><td><strong>FlexConnect</strong></td><td>Data switched locally at branch. Lets AP survive a WAN outage.</td></tr>
   </tbody></table></div>
   <div class="note exam"><span class="i">🎯</span><div><b>Memorize:</b> CAPWAP = UDP 5246 (control) and UDP 5247 (data). Lightweight APs are useless without a WLC unless in FlexConnect with locally-configured SSIDs.</div></div>`},

  {ico:"📡",title:"802.11 Standards & WLC Configuration",sub:"Wi-Fi 4/5/6/6E/7 · configuring a WLAN",
   html:`
   <div class="lead">Know which 802.11 standard runs on which band, the rough speeds, and how to add a WLAN on a WLC GUI.</div>
   <h4><span class="dot"></span>The 802.11 family</h4>
   <div class="tw"><table><thead><tr><th>Std</th><th>Marketing</th><th>Band</th><th>Max speed</th></tr></thead><tbody>
   <tr><td>802.11a</td><td>—</td><td>5 GHz</td><td>54 Mbps</td></tr>
   <tr><td>802.11b</td><td>—</td><td>2.4 GHz</td><td>11 Mbps</td></tr>
   <tr><td>802.11g</td><td>—</td><td>2.4 GHz</td><td>54 Mbps</td></tr>
   <tr><td>802.11n</td><td>Wi-Fi 4</td><td>2.4 + 5</td><td>~600 Mbps (MIMO)</td></tr>
   <tr><td>802.11ac</td><td>Wi-Fi 5</td><td>5</td><td>~3.5 Gbps</td></tr>
   <tr><td>802.11ax</td><td>Wi-Fi 6 / 6E</td><td>2.4 + 5 (+ 6 for 6E)</td><td>~9.6 Gbps · OFDMA, BSS coloring</td></tr>
   <tr><td>802.11be</td><td>Wi-Fi 7</td><td>2.4 + 5 + 6</td><td>~46 Gbps</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Bands and channels — what you must know</h4>
   <ul class="l">
   <li><strong>2.4 GHz</strong> — 3 non-overlapping channels (1, 6, 11). Crowded, longer range, worse throughput.</li>
   <li><strong>5 GHz</strong> — many non-overlapping channels, less interference, shorter range.</li>
   <li><strong>6 GHz</strong> (Wi-Fi 6E) — even more spectrum, Wi-Fi 6E-only clients.</li>
   </ul>
   <h4><span class="dot"></span>Adding a WLAN on a WLC (GUI flow)</h4>
   <ol class="l"><li><strong>Interfaces</strong> → create a dynamic interface mapped to the client VLAN.</li><li><strong>WLANs</strong> → Create New → set SSID, profile name, ID.</li><li><strong>General</strong> → enable WLAN; pick the interface from step 1.</li><li><strong>Security → Layer 2</strong> → WPA2/WPA3 + PSK or 802.1X (Enterprise).</li><li><strong>Security → AAA</strong> → if 802.1X, pick the RADIUS server.</li><li><strong>QoS, Advanced</strong> → fast roaming, band select, etc.</li><li>Apply.</li></ol>
   <h4><span class="dot"></span>RF terms</h4>
   <ul class="l"><li><strong>RSSI</strong> — received signal strength (negative dBm; closer to 0 is better; -65 is good).</li><li><strong>SNR</strong> — signal-to-noise ratio (higher is better; 25+ dB is good).</li><li><strong>RFP / RRM</strong> — radio resource management auto-adjusts power and channels.</li></ul>`},

  {ico:"🛜",title:"Wireless Security — WEP → WPA3",sub:"PSK vs Enterprise · encryption protocols",
   html:`
   <div class="lead">The Wi-Fi security stack evolved from "anyone can read it" to strong modern crypto. Know each and what replaced what.</div>
   <div class="tw"><table><thead><tr><th>Standard</th><th>Encryption</th><th>Auth</th><th>Status</th></tr></thead><tbody>
   <tr><td><strong>WEP</strong></td><td>RC4 (broken)</td><td>Pre-shared</td><td>NEVER — broken in minutes</td></tr>
   <tr><td><strong>WPA</strong></td><td>TKIP</td><td>PSK / Enterprise</td><td>Stopgap, also deprecated</td></tr>
   <tr><td><strong>WPA2</strong></td><td>AES-CCMP</td><td>PSK / Enterprise (802.1X)</td><td>Long-time standard, still widely used</td></tr>
   <tr><td><strong>WPA3</strong></td><td>AES-GCMP</td><td>SAE (Personal), 802.1X (Enterprise)</td><td>Current — fixes WPA2 KRACK and weak-PSK issues</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Personal vs Enterprise</h4>
   <ul class="l"><li><strong>Personal (PSK)</strong> — one shared password. Easy, but anyone with the password is in. WPA3 uses SAE so password guessing is much harder.</li><li><strong>Enterprise (802.1X)</strong> — every user authenticates individually against a RADIUS server (often with AD credentials or a certificate). Revocable, auditable, no shared secret.</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>SAE = Simultaneous Authentication of Equals.</b> WPA3's replacement for WPA2's 4-way PSK handshake, immune to offline brute-force.</div></div>`},
 ]},

/* ============================================================
   DOMAIN 3 — IP CONNECTIVITY (25% of exam — the biggest)
   ============================================================ */
{id:"d3", name:"D3 · IP Connectivity", icon:"🗺️", domain:"3", weight:25,
 blurb:"How routers move packets between networks. The largest single domain (25%) — subnetting, IPv6, OSPF, FHRP, the routing table. Master this.",
 cards:[
  {ico:"📍",title:"IPv4 Addressing & Binary",sub:"What an IP really is under the hood",
   html:`
   <div class="lead">An IPv4 address is a 32-bit binary number written as four dotted octets (each 0–255). The subnet mask says how many of those bits identify the network vs the host.</div>
   <h4><span class="dot"></span>Anatomy</h4>
   <p class="b">192.168.10.50 / 255.255.255.0  is equivalent to 192.168.10.50/24. The /24 means the first 24 bits are "network" and the last 8 are "host." Every device on the same network shares the network portion.</p>
   <h4><span class="dot"></span>Network address vs broadcast vs usable hosts</h4>
   <ul class="l"><li><strong>Network address</strong> — all host bits 0 (e.g. 192.168.10.0). Identifies the subnet, NOT assigned to a host.</li><li><strong>Broadcast</strong> — all host bits 1 (e.g. 192.168.10.255). Sent to "everyone on this subnet."</li><li><strong>Usable hosts</strong> — everything in between. Formula: <strong>2^(host bits) − 2</strong>.</li></ul>
   <h4><span class="dot"></span>Quick mask cheat-sheet</h4>
   <div class="tw"><table><thead><tr><th>CIDR</th><th>Mask</th><th>Hosts</th></tr></thead><tbody>
   <tr><td>/24</td><td>255.255.255.0</td><td>254</td></tr>
   <tr><td>/25</td><td>255.255.255.128</td><td>126</td></tr>
   <tr><td>/26</td><td>255.255.255.192</td><td>62</td></tr>
   <tr><td>/27</td><td>255.255.255.224</td><td>30</td></tr>
   <tr><td>/28</td><td>255.255.255.240</td><td>14</td></tr>
   <tr><td>/29</td><td>255.255.255.248</td><td>6</td></tr>
   <tr><td>/30</td><td>255.255.255.252</td><td>2 (point-to-point)</td></tr>
   <tr><td>/31</td><td>255.255.255.254</td><td>2 (RFC 3021, P2P only)</td></tr>
   <tr><td>/32</td><td>255.255.255.255</td><td>1 (host route, loopback)</td></tr>
   </tbody></table></div>`},

  {ico:"✂️",title:"Subnetting — The Complete Method",sub:"The 4-step block-size method · every question type",
   html:`
   <div class="lead">Subnetting is the most-tested skill. There are five question types and one repeatable method that handles all of them in under a minute.</div>
   <h4><span class="dot"></span>The 4-step method</h4>
   <ol class="l">
   <li><strong>Block size</strong> in the interesting octet. Block = 256 − mask octet. Examples: /26 → mask 192 → block 64. /27 → 224 → 32. /28 → 240 → 16. /29 → 248 → 8.</li>
   <li><strong>Find the interesting octet.</strong> For /25-/30 it's the 4th. For /17-/24 it's the 3rd. For /9-/16 it's the 2nd.</li>
   <li><strong>List subnet starts</strong> by counting up in block size: 0, block, 2×block, … until you cover the host.</li>
   <li><strong>Network = last start ≤ host. Broadcast = next start − 1. Usable = network+1 to broadcast−1.</strong></li>
   </ol>
   <h4><span class="dot"></span>Worked examples</h4>
   <div class="example"><span class="tag">Q1 — Find the network of 192.168.10.100/26</span>
   <p><strong>Mask:</strong> /26 = 255.255.255.192. <strong>Block:</strong> 256 − 192 = 64. <strong>Interesting octet:</strong> 4th.</p>
   <p><strong>Subnets:</strong> .0, .64, .128, .192. The host .100 sits in the .64 subnet.</p>
   <p>✅ <strong>Network 192.168.10.64</strong>, broadcast 192.168.10.127, usable .65–.126.</p></div>
   <div class="example"><span class="tag">Q2 — How many hosts on a /28?</span>
   <p>32 − 28 = 4 host bits. 2^4 = 16. Minus 2 (network + broadcast) = <strong>14 usable hosts</strong>.</p></div>
   <div class="example"><span class="tag">Q3 — Broadcast of 172.16.50.150/22?</span>
   <p><strong>/22</strong> is in the 3rd octet — mask 255.255.<strong>252</strong>.0. Block 4. Subnets in 3rd octet: 0, 4, 8, 12 … 48, 52. The host 172.16.<strong>50</strong>.150 is in 172.16.<strong>48</strong>.0 (48 + 4 = 52, next).</p>
   <p>✅ <strong>Broadcast 172.16.51.255</strong> (next subnet 172.16.52.0, minus 1).</p></div>
   <div class="example"><span class="tag">Q4 — Need 50 hosts. Smallest mask?</span>
   <p>2^n − 2 ≥ 50 → n=6 host bits (2^6 − 2 = 62 ≥ 50). 32 − 6 = <strong>/26</strong>.</p></div>
   <div class="example"><span class="tag">Q5 — Need 30 subnets from a /24. New mask?</span>
   <p>2^n ≥ 30 → n=5 borrowed bits. 24 + 5 = <strong>/29</strong>. Block 8. Hosts each: 2^3 − 2 = 6.</p></div>
   <div class="note key"><span class="i">🔑</span><div><b>Wildcard mask</b> = inverse of subnet mask. /24 = 255.255.255.0 → wildcard 0.0.0.255. Used in ACLs and OSPF network statements.</div></div>
   <div class="note exam"><span class="i">🎯</span><div><b>Speed tip:</b> Memorize block sizes for /25 (128), /26 (64), /27 (32), /28 (16), /29 (8), /30 (4), /22 (4 in 3rd octet), /21 (8 in 3rd octet). You should solve any standard subnetting question in &lt; 60 seconds.</div></div>`},

  {ico:"🧩",title:"VLSM & Route Summarization",sub:"Right-sizing subnets · shrinking routing tables",
   html:`
   <div class="lead">VLSM lets you carve a single block into subnets of different sizes, matching real needs. Summarization does the opposite — combines many small routes into one large advertisement.</div>
   <h4><span class="dot"></span>VLSM rules</h4>
   <ol class="l"><li>Order subnets <strong>largest first</strong>.</li><li>Pick the smallest mask that fits each requirement.</li><li>Carve them from the parent block sequentially.</li><li>The leftover space is for future use (or smaller subnets like /30 WAN links).</li></ol>
   <div class="example"><span class="tag">VLSM design — parent 192.168.1.0/24, needs: 60, 30, 12, 2 hosts</span>
   <p>60 hosts → /26 (62 usable). Use <strong>192.168.1.0/26</strong> (.0–.63).</p>
   <p>30 hosts → /27 (30 usable). Use <strong>192.168.1.64/27</strong> (.64–.95).</p>
   <p>12 hosts → /28 (14 usable). Use <strong>192.168.1.96/28</strong> (.96–.111).</p>
   <p>2 hosts (WAN) → /30 (2 usable). Use <strong>192.168.1.112/30</strong> (.112–.115).</p>
   <p>Leftover: .116–.255 for future. ✅ No address waste like with fixed /27.</p></div>
   <h4><span class="dot"></span>Route summarization</h4>
   <p class="b">If a router advertises 10.0.0.0/24, 10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24 — that's 4 routes. Summarize to <strong>10.0.0.0/22</strong> — one route covers all four.</p>
   <p class="b">The summary mask = the longest mask where ALL the binary network bits match. Write each network in binary; find where the bits start to differ; that's where the summary mask ends.</p>`},

  {ico:"🆕",title:"IPv6 Fundamentals",sub:"128 bits · the future · abbreviation rules",
   html:`
   <div class="lead">IPv6 has 128-bit addresses (2^128 ≈ 3.4 × 10^38). Plenty for now. The CCNA tests the format, abbreviation rules, address types, and basic configuration.</div>
   <h4><span class="dot"></span>Format</h4>
   <p class="b">Eight groups of four hex digits separated by colons. Example: <code>2001:0DB8:0000:0000:0000:FF00:0042:8329</code>.</p>
   <h4><span class="dot"></span>Abbreviation rules</h4>
   <ol class="l"><li>Drop leading zeros in any group: <code>2001:DB8:0:0:0:FF00:42:8329</code>.</li><li>Replace ONE run of consecutive all-zero groups with <code>::</code>. <strong>Only once</strong> per address: <code>2001:DB8::FF00:42:8329</code>.</li></ol>
   <h4><span class="dot"></span>Address types</h4>
   <div class="tw"><table><thead><tr><th>Type</th><th>Prefix</th><th>Use</th></tr></thead><tbody>
   <tr><td><strong>Global Unicast</strong></td><td>2000::/3</td><td>Like public IPv4 — routable on the internet</td></tr>
   <tr><td><strong>Unique Local (ULA)</strong></td><td>FC00::/7 (often FD00::/8)</td><td>IPv6 equivalent of RFC 1918 private</td></tr>
   <tr><td><strong>Link-Local</strong></td><td>FE80::/10</td><td>One-hop only; every interface has one; required for many functions</td></tr>
   <tr><td><strong>Multicast</strong></td><td>FF00::/8</td><td>Replaces broadcast (which doesn't exist in IPv6)</td></tr>
   <tr><td><strong>Loopback</strong></td><td>::1/128</td><td>Equivalent of 127.0.0.1</td></tr>
   <tr><td><strong>Unspecified</strong></td><td>::/128</td><td>Equivalent of 0.0.0.0</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Critical multicast groups</h4>
   <ul class="l"><li><strong>FF02::1</strong> — all nodes on link</li><li><strong>FF02::2</strong> — all routers on link</li><li><strong>FF02::5</strong> — OSPFv3 all routers</li><li><strong>FF02::6</strong> — OSPFv3 DR/BDR</li><li><strong>FF02::9</strong> — RIPng</li><li><strong>FF02::A</strong> — EIGRP for IPv6</li></ul>
   <h4><span class="dot"></span>No broadcast in IPv6</h4>
   <p class="b">Where IPv4 broadcasts, IPv6 multicasts. ARP is replaced by <strong>NDP</strong> (Neighbor Discovery Protocol) using ICMPv6 — same idea, but multicast instead of broadcast.</p>`},

  {ico:"🔧",title:"IPv6 Configuration & SLAAC",sub:"Assigning v6 addresses · auto-config · EUI-64",
   html:`
   <div class="lead">IPv6 can be configured manually, with EUI-64 auto-generation, via SLAAC (no server), or via DHCPv6. Hosts often combine SLAAC + stateless DHCPv6 for DNS.</div>
   <h4><span class="dot"></span>Enable IPv6 routing</h4>
   <div class="code"><span class="p">R1(config)#</span> ipv6 unicast-routing<br><span class="p">R1(config)#</span> interface gi0/0<br><span class="p">R1(config-if)#</span> ipv6 address 2001:db8:1::1/64<br><span class="p">R1(config-if)#</span> ipv6 address 2001:db8:2::/64 eui-64 <span class="c">! host portion from MAC</span><br><span class="p">R1(config-if)#</span> ipv6 enable <span class="c">! link-local only</span></div>
   <h4><span class="dot"></span>EUI-64</h4>
   <p class="b">Takes a 48-bit MAC, splits it in half, inserts <strong>FFFE</strong> in the middle, and flips bit 7 (U/L bit). The result is the 64-bit interface ID:</p>
   <p class="b">MAC <code>00:11:22:33:44:55</code> → flip bit 7 → <code>02:11:22</code> → insert FFFE → <strong>0211:22FF:FE33:4455</strong></p>
   <h4><span class="dot"></span>SLAAC (StateLess Address AutoConfiguration)</h4>
   <ol class="l"><li>Host sends <strong>Router Solicitation</strong> to FF02::2.</li><li>Routers reply with <strong>Router Advertisement</strong> containing the on-link /64 prefix.</li><li>Host generates its own interface ID (EUI-64 or randomized) and combines with the prefix.</li><li>Optionally also asks DHCPv6 for DNS (stateless DHCPv6).</li></ol>
   <h4><span class="dot"></span>Verification</h4>
   <div class="code"><span class="p">R1#</span> show ipv6 interface brief<br><span class="p">R1#</span> show ipv6 route<br><span class="p">R1#</span> show ipv6 neighbors <span class="c">! v6 ARP equivalent</span></div>`},

  {ico:"🧭",title:"How Routing Decisions Work",sub:"Routing table · AD · metric · longest match",
   html:`
   <div class="lead">When a packet arrives, a router consults its routing table and chooses ONE next hop using a strict order: longest-prefix match → administrative distance → metric.</div>
   <h4><span class="dot"></span>The decision order</h4>
   <ol class="l">
   <li><strong>Longest prefix match</strong> — the most specific route wins. /32 beats /30 beats /24.</li>
   <li><strong>Administrative distance</strong> — only tiebreaks among equally specific routes from different sources. Lower wins.</li>
   <li><strong>Metric</strong> — only tiebreaks within the same protocol. Lower wins.</li>
   </ol>
   <h4><span class="dot"></span>Administrative Distance (memorize)</h4>
   <div class="tw"><table><tbody>
   <tr><td>Connected</td><td><strong>0</strong></td></tr>
   <tr><td>Static</td><td>1</td></tr>
   <tr><td>eBGP</td><td>20</td></tr>
   <tr><td>EIGRP (internal)</td><td>90</td></tr>
   <tr><td>IGRP</td><td>100</td></tr>
   <tr><td>OSPF</td><td>110</td></tr>
   <tr><td>IS-IS</td><td>115</td></tr>
   <tr><td>RIP</td><td>120</td></tr>
   <tr><td>EIGRP (external)</td><td>170</td></tr>
