   <tr><td>iBGP</td><td>200</td></tr>
   <tr><td>Unreachable</td><td>255</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>Reading the routing table</h4>
   <div class="code"><span class="p">R1#</span> show ip route<br><span class="c">! Codes:</span><br>O&nbsp;&nbsp;&nbsp;&nbsp;10.0.1.0/24 [110/2] via 10.0.0.2, 00:05:31, Gi0/0<br><span class="c">! O = OSPF · [AD/metric] · via next-hop · age · interface</span><br>S* &nbsp;&nbsp;0.0.0.0/0 [1/0] via 192.0.2.1<br><span class="c">! S = static · * = candidate default route</span></div>`},

  {ico:"📌",title:"Static Routing",sub:"Hand-written routes · defaults · floating backups",
   html:`
   <div class="lead">Static routes are manually entered. Simple, predictable, AD 1 (very trusted). Great for stub networks, small networks, default routes, and as backups (floating static).</div>
   <h4><span class="dot"></span>Syntax</h4>
   <div class="code"><span class="p">R1(config)#</span> ip route 10.1.1.0 255.255.255.0 10.0.0.2 <span class="c">! next-hop IP</span><br><span class="p">R1(config)#</span> ip route 10.1.1.0 255.255.255.0 Serial0/0 <span class="c">! exit interface</span><br><span class="p">R1(config)#</span> ip route 10.1.1.0 255.255.255.0 Gi0/0 10.0.0.2 <span class="c">! both (recommended)</span><br><span class="p">R1(config)#</span> ip route 0.0.0.0 0.0.0.0 192.0.2.1 <span class="c">! default route</span></div>
   <h4><span class="dot"></span>Floating static — automatic backup</h4>
   <p class="b">Add a high AD so the static only installs if the primary (dynamic) route disappears:</p>
   <div class="code"><span class="p">R1(config)#</span> ip route 10.1.1.0 255.255.255.0 192.168.1.1 <strong>200</strong></div>
   <p class="b">If OSPF (AD 110) is delivering the route, the static (AD 200) stays out of the RIB. If OSPF dies, the static "floats up" and installs.</p>
   <h4><span class="dot"></span>IPv6 statics</h4>
   <div class="code"><span class="p">R1(config)#</span> ipv6 route 2001:db8:1::/64 2001:db8:0::2<br><span class="p">R1(config)#</span> ipv6 route ::/0 2001:db8:0::2 <span class="c">! default</span></div>
   <h4><span class="dot"></span>Static route types</h4>
   <ul class="l"><li><strong>Network</strong> — toward a subnet (most common).</li><li><strong>Default</strong> — 0.0.0.0/0, sends anything not in the table.</li><li><strong>Host</strong> — /32, single specific address.</li><li><strong>Floating</strong> — high AD, backup only.</li></ul>`},

  {ico:"⭐",title:"OSPF — Deep Dive (the most-tested protocol)",sub:"Link-state · adjacency · DR/BDR · cost · LSAs · areas",
   html:`
   <div class="lead">OSPF is THE routing protocol on the CCNA. Open standard, link-state, hierarchical (areas), fast convergence. Used in roughly every enterprise.</div>
   <h4><span class="dot"></span>The 7-state adjacency process</h4>
   <ol class="l">
   <li><strong>Down</strong> — no Hellos seen.</li>
   <li><strong>Init</strong> — received a Hello from a neighbor.</li>
   <li><strong>2-Way</strong> — bi-directional; both see each other. On multi-access this is where DR/BDR election happens; non-DR/non-BDR routers stop here.</li>
   <li><strong>ExStart</strong> — master/slave negotiated. <strong>Stuck here = MTU mismatch.</strong></li>
   <li><strong>Exchange</strong> — DBD packets summarize each side's LSDB.</li>
   <li><strong>Loading</strong> — request the LSAs you're missing.</li>
   <li><strong>Full</strong> — LSDBs synchronized; SPF runs; routes installed.</li>
   </ol>
   <h4><span class="dot"></span>What must match for adjacency</h4>
   <ul class="l">
   <li>Hello and Dead timers (default 10/40 on broadcast, 30/120 on NBMA)</li>
   <li>Same area</li>
   <li>Same subnet (interfaces on the same network)</li>
   <li>Same MTU</li>
   <li>Authentication (if configured)</li>
   <li>Both NOT passive on the link</li>
   </ul>
   <h4><span class="dot"></span>DR / BDR election (on broadcast/multi-access)</h4>
   <ol class="l"><li>Highest OSPF <strong>interface priority</strong> wins (default 1; 0 = ineligible).</li><li>Tie: highest <strong>Router ID</strong>.</li><li>DR/BDR is non-preemptive: once elected, doesn't change unless they fail.</li></ol>
   <p class="b">Non-DR/BDR routers form FULL adjacency with the DR/BDR only. They stay in 2-Way state with each other. This drastically reduces n² flooding.</p>
   <h4><span class="dot"></span>Router ID selection</h4>
   <ol class="l"><li>Explicitly configured: <code>router-id 1.1.1.1</code> — wins.</li><li>Otherwise highest IP on an UP loopback (loopbacks recommended — never flap).</li><li>Otherwise highest IP on an UP physical interface.</li></ol>
   <h4><span class="dot"></span>OSPF cost</h4>
   <p class="b">Cost = 10^8 / bandwidth (bps). FastEthernet (100 Mbps) = 1. GigE = 1 (same!). Always reference-bandwidth-tune in real networks:</p>
   <div class="code"><span class="p">R1(config-router)#</span> auto-cost reference-bandwidth 10000 <span class="c">! 10 Gbps in Mbps</span></div>
   <h4><span class="dot"></span>Configuration — every line you need</h4>
   <div class="code"><span class="p">R1(config)#</span> router ospf 1<br><span class="p">R1(config-router)#</span> router-id 1.1.1.1<br><span class="p">R1(config-router)#</span> network 10.0.0.0 0.0.0.255 area 0<br><span class="p">R1(config-router)#</span> network 192.168.1.0 0.0.0.255 area 0<br><span class="p">R1(config-router)#</span> passive-interface gi0/0 <span class="c">! suppress hellos on LAN</span><br><span class="p">R1(config-router)#</span> auto-cost reference-bandwidth 10000<br><br><span class="c">! Per-interface alternative (cleaner):</span><br><span class="p">R1(config-if)#</span> ip ospf 1 area 0<br><span class="p">R1(config-if)#</span> ip ospf cost 100<br><span class="p">R1(config-if)#</span> ip ospf hello-interval 5<br><span class="p">R1(config-if)#</span> ip ospf dead-interval 20<br><span class="p">R1(config-if)#</span> ip ospf priority 200<br><span class="p">R1(config-if)#</span> ip ospf network point-to-point</div>
   <h4><span class="dot"></span>Verification</h4>
   <div class="code"><span class="p">R1#</span> show ip ospf neighbor<br><span class="p">R1#</span> show ip ospf interface gi0/0<br><span class="p">R1#</span> show ip ospf database<br><span class="p">R1#</span> show ip route ospf<br><span class="p">R1#</span> show ip protocols</div>
   <h4><span class="dot"></span>Areas — the hierarchy</h4>
   <ul class="l"><li><strong>Area 0</strong> — backbone, mandatory. All other areas connect to it.</li><li><strong>ABR</strong> — Area Border Router (connects an area to area 0).</li><li><strong>ASBR</strong> — Autonomous System Boundary Router (redistributes external routes in).</li><li>Single-area OSPF (everything in area 0) is what CCNA primarily tests; just know the multi-area roles exist.</li></ul>
   <div class="note exam"><span class="i">🎯</span><div><b>The big traps:</b><br>• Stuck EXSTART/EXCHANGE → MTU mismatch.<br>• 2-WAY with non-DR/BDR neighbors is NORMAL, not a problem.<br>• Wildcard mask in <code>network</code>, not subnet mask.<br>• Passive interface stops hellos but the network is still advertised.</div></div>`},

  {ico:"🛡️",title:"First Hop Redundancy (HSRP)",sub:"Gateway redundancy · so one router dying ≠ outage",
   html:`
   <div class="lead">If a host's default gateway fails, it can't leave its subnet. FHRP gives hosts a virtual gateway shared by two routers — failover is automatic, the host never changes its settings.</div>
   <h4><span class="dot"></span>Three FHRPs to know</h4>
   <div class="tw"><table><thead><tr><th>Protocol</th><th>Standard</th><th>Roles</th><th>Multicast</th></tr></thead><tbody>
   <tr><td><strong>HSRP</strong></td><td>Cisco</td><td>Active / Standby</td><td>224.0.0.2 (v1), 224.0.0.102 (v2)</td></tr>
   <tr><td><strong>VRRP</strong></td><td>Open</td><td>Master / Backup</td><td>224.0.0.18</td></tr>
   <tr><td><strong>GLBP</strong></td><td>Cisco</td><td>AVG + AVFs (load-shares)</td><td>224.0.0.102</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>HSRP election</h4>
   <ol class="l"><li>Highest <strong>priority</strong> (default 100) becomes Active.</li><li>Tie: highest IP. </li><li>Non-preemptive by default — a recovered higher-priority router does NOT reclaim Active unless you enable <code>preempt</code>.</li></ol>
   <h4><span class="dot"></span>Virtual MAC</h4>
   <p class="b">HSRPv1 uses <code>0000.0C07.AC<strong>XX</strong></code> where XX is the group number in hex. So group 1 = ...AC01. Hosts ARP for the virtual IP and get this virtual MAC.</p>
   <h4><span class="dot"></span>Configuration</h4>
   <div class="code"><span class="p">R1(config)#</span> interface gi0/0<br><span class="p">R1(config-if)#</span> ip address 10.0.0.2 255.255.255.0<br><span class="p">R1(config-if)#</span> standby 1 ip 10.0.0.1 <span class="c">! virtual IP</span><br><span class="p">R1(config-if)#</span> standby 1 priority 110<br><span class="p">R1(config-if)#</span> standby 1 preempt<br><span class="p">R1(config-if)#</span> standby 1 track gi0/1 20 <span class="c">! drop 20 if uplink fails</span><br><br><span class="p">R1#</span> show standby brief</div>
   <h4><span class="dot"></span>Interface tracking</h4>
   <p class="b">If R1's uplink dies, you don't want R1 to keep being Active and black-hole traffic. <strong>Track</strong> the uplink and decrement HSRP priority when it goes down; R2 takes over.</p>`},

  {ico:"🔬",title:"Troubleshooting Connectivity (Systematic)",sub:"A repeatable path-isolation method",
   html:`
   <div class="lead">When something doesn't work, follow the layers from bottom up. Don't guess — verify each step.</div>
   <h4><span class="dot"></span>Bottom-up troubleshooting</h4>
   <ol class="l">
   <li><strong>L1</strong> — is the cable plugged in? Link LED? <code>show interface</code> for up/up.</li>
   <li><strong>L2</strong> — correct VLAN? Trunk allows the VLAN? <code>show mac address-table</code> to see if the source learned.</li>
   <li><strong>L3 — local</strong> — host has IP/mask/gateway? Gateway IS in the subnet? Ping the gateway.</li>
   <li><strong>L3 — remote</strong> — ping next-hop. <code>traceroute</code> to see where it dies. <code>show ip route</code> on the routers — is there a route to the destination?</li>
   <li><strong>L4-7</strong> — telnet/curl the port. Firewall in the way? DNS working (ping by name)?</li>
   </ol>
   <h4><span class="dot"></span>The classic "IP works, DNS broken"</h4>
   <p class="b">Symptom: <code>ping 8.8.8.8</code> succeeds, <code>ping google.com</code> fails. Cause: DNS misconfig. Check <code>ipconfig /all</code> on Windows or <code>/etc/resolv.conf</code> on Linux.</p>
   <h4><span class="dot"></span>The "local works, internet doesn't"</h4>
   <p class="b">Reaches gateway, fails beyond it. Causes: missing default route, NAT misconfig, WAN interface down, ISP issue.</p>
   <div class="note tip"><span class="i">💡</span><div><b>Show-command order:</b> <code>show ip int brief</code> → <code>show interface</code> → <code>show ip route</code> → <code>show running-config interface X</code> → <code>show cdp neighbors detail</code>. Always check both ends of the link.</div></div>`},

  {ico:"🧮",title:"Routing Protocols Compared",sub:"Static vs dynamic · IGP vs EGP · DV vs link-state",
   html:`
   <div class="lead">Know how the families differ and which class each protocol falls into. Quick-fire CCNA fodder.</div>
   <h4><span class="dot"></span>Categories</h4>
   <div class="tw"><table><thead><tr><th>Category</th><th>Examples</th><th>How they pick routes</th></tr></thead><tbody>
   <tr><td><strong>Distance Vector</strong></td><td>RIP, EIGRP</td><td>Tell neighbors what YOU know, count hops/metric. "Routing by rumor."</td></tr>
   <tr><td><strong>Link State</strong></td><td>OSPF, IS-IS</td><td>Flood link info, every router builds full topology, runs SPF. Faster convergence.</td></tr>
   <tr><td><strong>Path Vector</strong></td><td>BGP</td><td>Each route carries the AS path it traversed. Used between ISPs.</td></tr>
   </tbody></table></div>
   <h4><span class="dot"></span>IGP vs EGP</h4>
   <ul class="l"><li><strong>IGP</strong> — within an AS: OSPF, EIGRP, RIP, IS-IS.</li><li><strong>EGP</strong> — between ASes: BGP.</li></ul>
   <h4><span class="dot"></span>Convergence speed</h4>
   <p class="b">Link state &gt; EIGRP &gt; Distance vector. RIP can take minutes; OSPF takes seconds. Routing protocols converge faster on faster links, smaller topologies, and with tuned timers.</p>
   <h4><span class="dot"></span>Classful vs classless</h4>
   <ul class="l"><li><strong>Classful (RIPv1, IGRP)</strong> — no mask in updates → doesn't support VLSM. Obsolete.</li><li><strong>Classless (everything modern)</strong> — sends prefix length → supports VLSM, CIDR.</li></ul>`},

  {ico:"📨",title:"The Packet Forwarding Process",sub:"What a router actually does, hop by hop",
   html:`
   <div class="lead">Following one packet through three routers is the cleanest way to internalize how routing, ARP, and Ethernet all interact.</div>
   <h4><span class="dot"></span>The journey: PC A (10.1.1.10) → PC B (10.2.2.20)</h4>
   <ol class="l">
   <li>PC A sees 10.2.2.20 is NOT in its subnet → must send to gateway.</li>
   <li>PC A ARPs for gateway MAC (10.1.1.1).</li>
   <li>Frame goes to gateway: src MAC = PC A's NIC, dst MAC = R1's gi0/0 MAC. Source IP = 10.1.1.10, dst IP = 10.2.2.20.</li>
   <li>R1 receives. Strips the frame. Looks up 10.2.2.20 in its routing table → next hop R2 via gi0/1.</li>
   <li>R1 ARPs for R2's MAC, builds a NEW frame: src MAC = R1's gi0/1 MAC, dst MAC = R2's MAC. <em>IP packet inside is unchanged.</em></li>
   <li>R2 does the same: routes to R3.</li>
   <li>R3 sees 10.2.2.0/24 is directly connected. ARPs for PC B's MAC. Sends final frame to PC B.</li>
   </ol>
   <div class="note key"><span class="i">🔑</span><div><b>Core principle:</b> IP source and destination stay the same end-to-end. MAC addresses change at every router hop. TTL decrements by 1 at each router.</div></div>
   <h4><span class="dot"></span>What hits the CPU vs the ASIC</h4>
   <p class="b">In modern routers/L3 switches, the first packet of a flow may hit the CPU (control plane) to populate <strong>CEF</strong> (Cisco Express Forwarding). Subsequent packets are switched in hardware (data plane) using the FIB and adjacency table — wire speed.</p>`},
 ]},


 {id:"d4", name:"D4 · IP Services", icon:"⚙️", domain:"4", weight:10,
  blurb:"DHCP, NAT, NTP, DNS, SNMP, Syslog, QoS, FTP/TFTP/SCP, SSH — the services that make networks usable.",
  cards:[
  {ico:"🏷️",title:"DHCP — Dynamic Host Configuration Protocol",sub:"DORA, lease lifecycle, server and relay",
   html:`
   <div class="lead">DHCP automates IP assignment. Without it, every device needs static config — impossible at scale.</div>
   <h4><span class="dot"></span>The DORA exchange (memorize)</h4>
   <ul class="l">
   <li><strong>D</strong>iscover — client broadcasts (src 0.0.0.0 → 255.255.255.255, UDP 67/68) "anyone out there?"</li>
   <li><strong>O</strong>ffer — server replies with a proposed IP + options.</li>
   <li><strong>R</strong>equest — client broadcasts "I accept that offer" (so other servers withdraw).</li>
   <li><strong>A</strong>ck — server confirms and records the lease.</li>
   </ul>
   <div class="note tip"><span class="i">💡</span><div>DHCP uses UDP <b>67</b> (server) and <b>68</b> (client). Both Discover and Request are <b>broadcasts</b> — this is why DHCP doesn't cross routers without a relay.</div></div>
   <h4><span class="dot"></span>Cisco IOS DHCP server</h4>
   <pre><code>ip dhcp excluded-address 10.1.1.1 10.1.1.10
ip dhcp pool LAN
 network 10.1.1.0 /24
 default-router 10.1.1.1
 dns-server 8.8.8.8 1.1.1.1
 domain-name lab.local
 lease 7</code></pre>
   <h4><span class="dot"></span>DHCP Relay (ip helper-address)</h4>
   <p class="b">Because routers don't forward broadcasts, a remote subnet needs a <strong>relay agent</strong>. The router's SVI/interface forwards DHCP traffic as unicast to the server.</p>
   <pre><code>interface vlan 20
 ip address 10.20.0.1 255.255.255.0
 ip helper-address 10.99.0.10   ! address of DHCP server</code></pre>
   <p class="b">Verify: <code>show ip dhcp binding</code>, <code>show ip dhcp pool</code>, <code>debug ip dhcp server packet</code> (lab only).</p>
   <div class="note warn"><span class="i">⚠️</span><div>The relay rewrites the giaddr (gateway IP) field so the server knows which subnet to serve from.</div></div>`},

  {ico:"🔁",title:"NAT & PAT",sub:"Static, dynamic, overload — the IPv4 lifeline",
   html:`
   <div class="lead">NAT translates private (RFC 1918) addresses into public ones at the edge — without it, the IPv4 internet would have collapsed long ago.</div>
   <h4><span class="dot"></span>Three flavors</h4>
   <ul class="l">
   <li><strong>Static NAT</strong> — one private ↔ one public (used for servers).</li>
   <li><strong>Dynamic NAT</strong> — pool of public IPs, first-come first-served (rare).</li>
   <li><strong>PAT / NAT Overload</strong> — many private → one public, differentiated by source port. <em>This is what your home router does.</em></li>
   </ul>
   <h4><span class="dot"></span>Inside/outside terminology</h4>
   <table class="kt"><tr><th>Term</th><th>Meaning</th></tr>
   <tr><td>Inside local</td><td>Private IP of your host (e.g., 192.168.1.50)</td></tr>
   <tr><td>Inside global</td><td>Public IP after translation (e.g., 203.0.113.5)</td></tr>
   <tr><td>Outside global</td><td>Real public IP of remote server</td></tr>
   <tr><td>Outside local</td><td>How outside appears to inside (rare; usually same as outside global)</td></tr></table>
   <h4><span class="dot"></span>PAT config (most tested)</h4>
   <pre><code>access-list 1 permit 192.168.1.0 0.0.0.255
ip nat inside source list 1 interface g0/1 overload

interface g0/0
 ip nat inside
interface g0/1
 ip nat outside</code></pre>
   <p class="b">Verify with <code>show ip nat translations</code> and <code>show ip nat statistics</code>.</p>
   <div class="note key"><span class="i">🔑</span><div>The <code>overload</code> keyword is what makes it PAT instead of dynamic NAT. Without it, each host needs its own public IP from the pool.</div></div>`},

  {ico:"⏰",title:"NTP — Network Time Protocol",sub:"Stratum, sync, why time matters",
   html:`
   <div class="lead">Accurate clocks underpin logging, certificates, Kerberos, and forensics. NTP keeps every device on the same second.</div>
   <h4><span class="dot"></span>Stratum levels</h4>
   <ul class="l">
   <li><strong>Stratum 0</strong> — atomic clock / GPS (reference, not on network).</li>
   <li><strong>Stratum 1</strong> — server directly attached to stratum 0.</li>
   <li><strong>Stratum 2–15</strong> — each hop adds 1. Stratum 16 = unsynchronized.</li>
   </ul>
   <h4><span class="dot"></span>Config</h4>
   <pre><code>ntp server 132.163.97.1
ntp server 129.6.15.28 prefer
clock timezone PST -8
clock summer-time PDT recurring
service timestamps log datetime msec localtime
service timestamps debug datetime msec</code></pre>
   <p class="b">Verify: <code>show ntp status</code>, <code>show ntp associations</code>. A leading <code>*</code> means synced; <code>~</code> means configured.</p>
   <div class="note tip"><span class="i">💡</span><div>NTP uses UDP <b>123</b>. Authentication exists (<code>ntp authenticate</code>) for hardening.</div></div>`},

  {ico:"🌐",title:"DNS — Deep Dive",sub:"Hierarchy, record types, recursion",
   html:`
   <div class="lead">DNS turns names into addresses. It is hierarchical, distributed, mostly UDP/53, and absolutely critical.</div>
   <h4><span class="dot"></span>Hierarchy</h4>
   <p class="b">Root (".") → TLD (.com, .org) → Authoritative server for the domain (cisco.com) → host record (www).</p>
   <h4><span class="dot"></span>Record types you must know</h4>
   <table class="kt"><tr><th>Type</th><th>Meaning</th></tr>
   <tr><td><b>A</b></td><td>Name → IPv4</td></tr>
   <tr><td><b>AAAA</b></td><td>Name → IPv6</td></tr>
   <tr><td><b>CNAME</b></td><td>Alias to another name</td></tr>
   <tr><td><b>MX</b></td><td>Mail exchanger (with priority)</td></tr>
   <tr><td><b>PTR</b></td><td>Reverse: IP → name</td></tr>
   <tr><td><b>NS</b></td><td>Authoritative name server for the zone</td></tr>
   <tr><td><b>SOA</b></td><td>Start of authority — zone metadata</td></tr>
   <tr><td><b>TXT</b></td><td>Arbitrary text (SPF, DKIM, verification)</td></tr></table>
   <h4><span class="dot"></span>Resolution: recursive vs iterative</h4>
   <p class="b">A client asks its resolver <em>recursively</em> ("give me the answer"). The resolver then queries root, TLD, and authoritative servers <em>iteratively</em>, walking the tree. Results are cached for the TTL.</p>
   <h4><span class="dot"></span>Router as DNS client / server</h4>
   <pre><code>ip name-server 8.8.8.8 1.1.1.1
ip domain-lookup
ip domain-name lab.local
ip host R1-loop 10.0.0.1</code></pre>
   <div class="note warn"><span class="i">⚠️</span><div>DNS uses UDP/53 for most queries and TCP/53 for zone transfers and responses over 512 bytes (DNSSEC, EDNS). On the exam: "DNS uses UDP and TCP port 53".</div></div>`},

  {ico:"📡",title:"SNMP & Syslog",sub:"Polling, traps, severity levels",
   html:`
   <div class="lead">SNMP and Syslog are how the network talks back to its operators — health, alerts, telemetry.</div>
   <h4><span class="dot"></span>SNMP versions</h4>
   <table class="kt"><tr><th>Version</th><th>Auth</th><th>Encryption</th></tr>
   <tr><td>v1</td><td>Community string (plaintext)</td><td>None</td></tr>
   <tr><td>v2c</td><td>Community string (plaintext)</td><td>None</td></tr>
   <tr><td><b>v3</b></td><td>User-based + MD5/SHA</td><td>DES/AES — <b>use this</b></td></tr></table>
   <p class="b">Manager polls agents on UDP/161; agents send traps on UDP/162. MIB = the database of OIDs (Object Identifiers).</p>
   <h4><span class="dot"></span>Syslog severity (memorize 0–7)</h4>
   <table class="kt"><tr><th>Lvl</th><th>Keyword</th><th>Use</th></tr>
   <tr><td>0</td><td>Emergency</td><td>System unusable</td></tr>
   <tr><td>1</td><td>Alert</td><td>Immediate action</td></tr>
   <tr><td>2</td><td>Critical</td><td>Critical condition</td></tr>
   <tr><td>3</td><td>Error</td><td>Error conditions (link down)</td></tr>
   <tr><td>4</td><td>Warning</td><td>Warnings</td></tr>
   <tr><td>5</td><td>Notification</td><td>Normal but significant</td></tr>
   <tr><td>6</td><td>Informational</td><td>Informational</td></tr>
   <tr><td>7</td><td>Debug</td><td>Debug only</td></tr></table>
   <div class="note key"><span class="i">🔑</span><div>Mnemonic: <b>E</b>very <b>A</b>wesome <b>C</b>isco <b>E</b>ngineer <b>W</b>ill <b>N</b>eed <b>I</b>ce-cream <b>D</b>aily.</div></div>
   <h4><span class="dot"></span>Config</h4>
   <pre><code>logging host 10.0.0.50
logging trap warnings        ! capture levels 0–4
logging buffered 16384
service timestamps log datetime msec

snmp-server community READONLY ro
snmp-server location DC1-Rack3
snmp-server contact noc@lab.local
snmp-server enable traps
snmp-server host 10.0.0.50 version 2c READONLY</code></pre>`},

  {ico:"🚦",title:"QoS — Quality of Service",sub:"DSCP, markings, trust boundary",
   html:`
   <div class="lead">When the pipe is full, QoS decides who waits and who doesn't. Voice and video can't wait; bulk file transfers can.</div>
   <h4><span class="dot"></span>Mechanisms</h4>
   <ul class="l">
   <li><strong>Classification</strong> — identify traffic (ACL, NBAR, port).</li>
   <li><strong>Marking</strong> — write a value to the packet (DSCP at L3, CoS at L2).</li>
   <li><strong>Queuing</strong> — priority queue for voice (LLQ), CBWFQ for the rest.</li>
   <li><strong>Shaping vs Policing</strong> — shaping buffers excess; policing drops or remarks it.</li>
   <li><strong>Congestion avoidance</strong> — WRED drops low-priority before queues fill.</li>
   </ul>
   <h4><span class="dot"></span>DSCP values to know</h4>
   <table class="kt"><tr><th>DSCP</th><th>Name</th><th>Use</th></tr>
   <tr><td><b>EF (46)</b></td><td>Expedited Forwarding</td><td>Voice RTP</td></tr>
   <tr><td>CS6 (48)</td><td>Internetwork control</td><td>Routing protocols</td></tr>
   <tr><td>AF41 (34)</td><td>Assured Forwarding 4</td><td>Interactive video</td></tr>
   <tr><td>AF31 (26)</td><td>Assured Forwarding 3</td><td>Streaming/signaling</td></tr>
   <tr><td>Default (0)</td><td>Best-effort</td><td>Everything else</td></tr></table>
   <div class="note tip"><span class="i">💡</span><div><b>Trust boundary:</b> the closest point to the source you trust to mark correctly. IP phones mark themselves (CoS 5/DSCP EF); the access switch trusts them via <code>mls qos trust device cisco-phone</code>.</div></div>
   <h4><span class="dot"></span>Voice requirements (memorize)</h4>
   <ul class="l"><li>One-way delay ≤ <b>150 ms</b></li><li>Jitter ≤ <b>30 ms</b></li><li>Packet loss ≤ <b>1%</b></li></ul>`},

  {ico:"📤",title:"FTP / TFTP / SCP / SFTP",sub:"File transfer protocols compared",
   html:`
   <div class="lead">You'll need to copy IOS images, configs, and licenses. Each protocol has a niche.</div>
   <table class="kt"><tr><th>Protocol</th><th>Port</th><th>Transport</th><th>Auth</th><th>Encrypt</th></tr>
   <tr><td>FTP</td><td>20/21</td><td>TCP</td><td>User/pass</td><td>No</td></tr>
   <tr><td>TFTP</td><td>69</td><td>UDP</td><td>None</td><td>No</td></tr>
   <tr><td>SCP</td><td>22</td><td>TCP (over SSH)</td><td>SSH creds</td><td>Yes</td></tr>
   <tr><td>SFTP</td><td>22</td><td>TCP (over SSH)</td><td>SSH creds</td><td>Yes</td></tr>
   <tr><td>HTTP/S</td><td>80/443</td><td>TCP</td><td>Optional</td><td>HTTPS only</td></tr></table>
   <pre><code>! Backup running config to TFTP server
copy running-config tftp:
Address or name of remote host []? 10.0.0.50
Destination filename [r1-confg]?

! Upgrade IOS via SCP
copy scp: flash:
Address: 10.0.0.50
Username: admin
Source filename: c2900-universalk9-mz.SPA.157-3.M5.bin</code></pre>
   <div class="note warn"><span class="i">⚠️</span><div>TFTP has <b>no authentication</b> and is unencrypted — fine for lab/PXE, never for production over WAN.</div></div>`},

  {ico:"🔐",title:"SSH — Secure Shell",sub:"Configuration, key exchange, hardening",
   html:`
   <div class="lead">SSH replaces Telnet. Encrypted, authenticated, and required on every production device.</div>
   <h4><span class="dot"></span>The five required commands</h4>
   <pre><code>hostname R1
ip domain-name lab.local             ! required for RSA key naming
crypto key generate rsa modulus 2048
username admin privilege 15 secret StrongPass!
line vty 0 4
 login local
 transport input ssh                 ! disable telnet</code></pre>
   <h4><span class="dot"></span>SSH v1 vs v2</h4>
   <p class="b">Force version 2: <code>ip ssh version 2</code>. v1 has cryptographic weaknesses and should be disabled.</p>
   <div class="note key"><span class="i">🔑</span><div>Order matters: <b>hostname → domain-name → crypto key</b>. The hostname and domain form the key's FQDN identity.</div></div>
   <p class="b">Verify: <code>show ip ssh</code>, <code>show ssh</code> (active sessions). Time-out: <code>ip ssh time-out 60</code>; retry limit: <code>ip ssh authentication-retries 3</code>.</p>`},
 ]},

 {id:"d5", name:"D5 · Security Fundamentals", icon:"🛡️", domain:"5", weight:15,
  blurb:"CIA, AAA, 802.1X, ACLs, port security, VPNs, layer-2 attacks. 15% of the exam.",
  cards:[
  {ico:"🎯",title:"Security Concepts & CIA Triad",sub:"Vulnerability, threat, exploit, mitigation",
   html:`
   <div class="lead">Before any tool or command, master the vocabulary. CCNA expects you to use these words correctly.</div>
   <h4><span class="dot"></span>The CIA Triad</h4>
   <ul class="l">
   <li><strong>Confidentiality</strong> — only authorized eyes. Encryption (AES, TLS), access control.</li>
   <li><strong>Integrity</strong> — data unchanged in transit/storage. Hashes (SHA-256), digital signatures.</li>
   <li><strong>Availability</strong> — reachable when needed. Redundancy, DDoS protection, backups.</li>
   </ul>
   <h4><span class="dot"></span>Threat vocabulary</h4>
   <table class="kt"><tr><th>Term</th><th>Definition</th></tr>
   <tr><td>Vulnerability</td><td>A weakness (unpatched OS, weak password)</td></tr>
   <tr><td>Threat</td><td>A potential danger that exploits a vulnerability</td></tr>
   <tr><td>Exploit</td><td>The actual technique/code that takes advantage</td></tr>
   <tr><td>Risk</td><td>Likelihood × impact</td></tr>
   <tr><td>Mitigation</td><td>Control that reduces risk (patch, ACL, MFA)</td></tr></table>
   <h4><span class="dot"></span>Security program elements</h4>
   <ul class="l">
   <li><strong>User awareness</strong> — periodic emails, reminders.</li>
   <li><strong>User training</strong> — formal courses (phishing, policy).</li>
   <li><strong>Physical access control</strong> — badges, mantraps, cameras.</li>
   </ul>`},

  {ico:"👤",title:"AAA, 802.1X, RADIUS vs TACACS+",sub:"Who, what, when — authenticated, authorized, audited",
   html:`
   <div class="lead">AAA centralizes identity decisions. Instead of local users on 500 switches, you point them all at a central server.</div>
   <h4><span class="dot"></span>AAA</h4>
   <ul class="l">
   <li><strong>Authentication</strong> — proving who you are (password, cert, biometric, MFA).</li>
   <li><strong>Authorization</strong> — what you're allowed to do (read-only? config? specific commands?).</li>
   <li><strong>Accounting</strong> — what you did, when (audit logs).</li>
   </ul>
   <h4><span class="dot"></span>RADIUS vs TACACS+ (extremely tested)</h4>
   <table class="kt"><tr><th>Feature</th><th>RADIUS</th><th>TACACS+</th></tr>
   <tr><td>Transport</td><td>UDP 1812/1813</td><td>TCP 49</td></tr>
   <tr><td>Encryption</td><td>Only the password</td><td>Entire payload</td></tr>
   <tr><td>AAA bundling</td><td>Authn + Authz combined</td><td>Each separated</td></tr>
   <tr><td>Vendor</td><td>Open standard (IETF)</td><td>Cisco proprietary</td></tr>
   <tr><td>Best for</td><td>Network access (Wi-Fi, 802.1X)</td><td>Device admin (router CLI)</td></tr></table>
   <h4><span class="dot"></span>802.1X — port-based access control</h4>
   <p class="b">Three roles: <strong>Supplicant</strong> (client), <strong>Authenticator</strong> (switch/AP), <strong>Authentication Server</strong> (RADIUS/ISE). EAPOL between supplicant and authenticator; RADIUS between authenticator and server.</p>
   <pre><code>aaa new-model
radius server ISE
 address ipv4 10.0.0.20 auth-port 1812 acct-port 1813
 key MyRadiusSecret!
aaa authentication dot1x default group radius
dot1x system-auth-control
interface gi0/1
 switchport mode access
 authentication port-control auto
 dot1x pae authenticator</code></pre>`},

  {ico:"🔧",title:"Device Hardening & Secure CLI Access",sub:"Banners, passwords, SSH, auto-logout",
   html:`
   <div class="lead">A router with default settings is a published vulnerability. Hardening is a checklist; do every item.</div>
   <h4><span class="dot"></span>Password hygiene</h4>
   <pre><code>service password-encryption          ! weak (type 7), still better than plaintext
enable algorithm-type scrypt secret StrongPass!  ! type 9 — best
username admin privilege 15 secret CiscoCCNA!
security passwords min-length 10</code></pre>
   <p class="b">Cisco password types: <b>0</b> plaintext, <b>7</b> reversible (weak), <b>5</b> MD5, <b>8</b> PBKDF2-SHA-256, <b>9</b> scrypt. Use 8 or 9 when available.</p>
   <h4><span class="dot"></span>Console & VTY</h4>
   <pre><code>line con 0
 logging synchronous
 exec-timeout 5 0
 login local
line vty 0 4
 exec-timeout 5 0
 transport input ssh
 access-class MGMT-IN in
banner motd ^Authorized Access Only. Activity is logged.^</code></pre>
   <div class="note warn"><span class="i">⚠️</span><div>Disable services you don't use: <code>no ip http server</code>, <code>no cdp run</code> on edge ports, <code>no service finger</code>. Use <code>service tcp-keepalives-in</code> to drop dead sessions.</div></div>`},

  {ico:"🚧",title:"ACLs — Access Control Lists",sub:"Standard, extended, placement, named",
   html:`
   <div class="lead">ACLs are stateless packet filters. Order matters, the implicit deny is invisible, and placement is half the exam.</div>
   <h4><span class="dot"></span>Standard vs extended</h4>
   <table class="kt"><tr><th></th><th>Standard</th><th>Extended</th></tr>
   <tr><td>Match on</td><td>Source IP only</td><td>Src/Dst IP, protocol, ports, flags</td></tr>
   <tr><td>Numbers</td><td>1–99, 1300–1999</td><td>100–199, 2000–2699</td></tr>
   <tr><td>Placement</td><td>Close to destination</td><td>Close to source</td></tr></table>
   <h4><span class="dot"></span>Wildcard masks</h4>
   <p class="b">Inverse of subnet mask. <code>0.0.0.255</code> matches a /24; <code>0.0.0.0</code> matches one host (or use <code>host</code>); <code>255.255.255.255</code> matches everything (or use <code>any</code>).</p>
   <h4><span class="dot"></span>Extended ACL — named (preferred)</h4>
   <pre><code>ip access-list extended WEB-IN
 permit tcp any host 10.0.0.10 eq 80
 permit tcp any host 10.0.0.10 eq 443
 deny   ip  any any log
interface gi0/1
 ip access-group WEB-IN in</code></pre>
   <div class="note key"><span class="i">🔑</span><div>Every ACL ends with an <b>invisible deny any any</b>. If you only write permits, anything not listed is dropped. Always have at least one permit or your traffic stops.</div></div>
   <p class="b">Verify: <code>show access-lists</code>, <code>show ip interface gi0/1</code> (shows direction & ACL name).</p>
   <h4><span class="dot"></span>Editing named ACLs</h4>
   <pre><code>ip access-list extended WEB-IN
 5 permit tcp 10.1.1.0 0.0.0.255 host 10.0.0.10 eq 22
 no 20
 25 permit udp any host 10.0.0.10 eq 53</code></pre>`},

  {ico:"🛡️",title:"Layer-2 Security",sub:"Port security, DHCP snooping, DAI, BPDU guard",
   html:`
   <div class="lead">Most attacks come from inside the LAN — rogue laptops, mis-plugged cables, MAC floods. Layer-2 controls stop them at the access port.</div>
   <h4><span class="dot"></span>Port Security</h4>
   <p class="b">Limits the number of MACs on an access port. Violation modes:</p>
   <ul class="l">
   <li><strong>shutdown</strong> (default) — err-disable the port, log it.</li>
   <li><strong>restrict</strong> — drop offending frames, increment counter, send SNMP/syslog.</li>
   <li><strong>protect</strong> — drop offending frames silently.</li>
   </ul>
   <pre><code>interface gi0/1
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict</code></pre>
   <h4><span class="dot"></span>DHCP Snooping</h4>
   <p class="b">Switch inspects DHCP packets. Server replies are only accepted on <em>trusted</em> uplink ports; client ports can only originate DHCP requests. Stops rogue DHCP servers.</p>
   <pre><code>ip dhcp snooping
ip dhcp snooping vlan 10,20
interface gi0/24
 ip dhcp snooping trust         ! the uplink to real DHCP server</code></pre>
   <h4><span class="dot"></span>Dynamic ARP Inspection (DAI)</h4>
   <p class="b">Uses the DHCP snooping binding table to validate ARP replies — blocks ARP poisoning. Trusted uplinks; untrusted access ports.</p>
   <pre><code>ip arp inspection vlan 10,20
interface gi0/24
 ip arp inspection trust</code></pre>
   <h4><span class="dot"></span>BPDU Guard & Root Guard</h4>
   <p class="b"><strong>BPDU Guard</strong> on PortFast ports err-disables anything that sends a BPDU (rogue switch). <strong>Root Guard</strong> blocks superior BPDUs on designated ports (prevents an unauthorized root).</p>
   <pre><code>interface range gi0/1 - 23
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable</code></pre>`},

  {ico:"🔒",title:"VPNs & IPsec Overview",sub:"Site-to-site, remote access, SSL VPN",
   html:`
   <div class="lead">A VPN extends your private network over a public one securely. CCNA expects you to know the categories and the IPsec components.</div>
   <h4><span class="dot"></span>Categories</h4>
   <ul class="l">
   <li><strong>Site-to-Site IPsec</strong> — two routers, encrypted tunnel between sites. Transparent to users.</li>
   <li><strong>Remote-access SSL VPN</strong> — user runs AnyConnect; tunnel over TLS/443. Works through firewalls.</li>
   <li><strong>Remote-access IPsec VPN</strong> — older, requires client; some NAT issues.</li>
   <li><strong>DMVPN</strong> — hub-and-spoke that builds dynamic spoke-to-spoke tunnels.</li>
   </ul>
   <h4><span class="dot"></span>IPsec components</h4>
   <ul class="l">
   <li><strong>AH</strong> — Authentication Header. Integrity + authn, no encryption.</li>
   <li><strong>ESP</strong> — Encapsulating Security Payload. <em>Both</em> integrity and encryption — used in practice.</li>
   <li><strong>IKE</strong> — Internet Key Exchange. Two phases (1 = secure channel, 2 = SA for data).</li>
   </ul>
   <table class="kt"><tr><th>Mode</th><th>Use</th></tr>
   <tr><td>Transport</td><td>Encrypts payload only; endpoints terminate (host-to-host)</td></tr>
   <tr><td>Tunnel</td><td>Encrypts entire IP packet; gateways terminate (site-to-site)</td></tr></table>
   <div class="note tip"><span class="i">💡</span><div>You don't need to configure IPsec on CCNA, just identify the parts and what they do.</div></div>`},

  {ico:"🧬",title:"Authentication Methods & MFA",sub:"Passwords, certs, biometrics, tokens",
   html:`
   <div class="lead">Strong identity beats every other security control. Combine factors.</div>
   <h4><span class="dot"></span>Three factors</h4>
   <ul class="l">
   <li><strong>Something you know</strong> — password, PIN.</li>
   <li><strong>Something you have</strong> — token, certificate, phone (push, TOTP).</li>
   <li><strong>Something you are</strong> — fingerprint, face, iris.</li>
   </ul>
   <p class="b"><strong>MFA</strong> requires two different factors. Password + SMS code is technically two of the same factor if both are "have/know via phone" — true MFA pairs categories.</p>
   <h4><span class="dot"></span>Certificate-based</h4>
   <p class="b">A device holds a private key + a public cert signed by a CA. Authentication is by signing a challenge — no secret crosses the wire. Foundation of 802.1X EAP-TLS and most modern Wi-Fi enterprise.</p>
   <h4><span class="dot"></span>Password best practices</h4>
   <ul class="l"><li>Length > complexity (a 16-char passphrase beats P@ss1!).</li><li>Unique per service (password manager).</li><li>Hash + salt at rest.</li><li>Rotate only on compromise (modern guidance).</li></ul>`},

  {ico:"💥",title:"Common Attacks & Mitigations",sub:"Recognize and stop the classics",
   html:`
   <div class="lead">CCNA expects you to map attack → mitigation. Memorize the pairs.</div>
   <table class="kt"><tr><th>Attack</th><th>How</th><th>Mitigation</th></tr>
   <tr><td>MAC flooding</td><td>Fills CAM table → switch floods all frames</td><td>Port security</td></tr>
   <tr><td>VLAN hopping (DTP)</td><td>Negotiate trunk on access port</td><td><code>switchport nonegotiate</code>; access mode</td></tr>
   <tr><td>VLAN hopping (double-tag)</td><td>Two 802.1Q tags exploit native VLAN</td><td>Don't use VLAN 1; tag native VLAN</td></tr>
   <tr><td>Rogue DHCP server</td><td>Hands out attacker's gateway</td><td>DHCP snooping</td></tr>
   <tr><td>ARP poisoning (MITM)</td><td>Gratuitous ARP replies</td><td>Dynamic ARP Inspection (DAI)</td></tr>
   <tr><td>STP attack (root takeover)</td><td>Send superior BPDUs</td><td>Root Guard; BPDU Guard on edge</td></tr>
   <tr><td>Brute force / dictionary</td><td>Try many passwords</td><td>Strong policy; account lockout; MFA</td></tr>
   <tr><td>Phishing</td><td>Trick user into credentials</td><td>Training; MFA; DMARC</td></tr>
   <tr><td>DoS / DDoS</td><td>Flood resources</td><td>Rate limit; scrubbing; CDN</td></tr>
   <tr><td>Reflection / amplification</td><td>Spoofed src → big response</td><td>BCP 38 ingress filtering; close open resolvers</td></tr>
   <tr><td>On-path (MITM)</td><td>Intercept and modify</td><td>TLS; cert pinning; HSTS</td></tr>
   <tr><td>Malware / ransomware</td><td>Encrypts files for ransom</td><td>Backups; EDR; segmentation</td></tr>
   <tr><td>Social engineering</td><td>Manipulate humans</td><td>Awareness + verification policies</td></tr></table>`},
 ]},

 {id:"d6", name:"D6 · Automation & Programmability", icon:"🤖", domain:"6", weight:10,
  blurb:"SDN, REST APIs, JSON/YAML, Ansible/Puppet/Chef/Terraform, fabric overlays, AI/ML. 10% of v1.1.",
  cards:[
  {ico:"🧠",title:"SDN & Controller-Based Networking",sub:"Separation of planes; northbound vs southbound",
   html:`
   <div class="lead">Software-Defined Networking moves the brain (control plane) off each box and onto a central controller. The boxes (data plane) just forward.</div>
   <h4><span class="dot"></span>Three planes</h4>
   <ul class="l">
   <li><strong>Data plane</strong> — forwarding hardware; ASICs, CEF.</li>
   <li><strong>Control plane</strong> — routing decisions; OSPF, STP, ARP — traditionally on each device.</li>
   <li><strong>Management plane</strong> — humans configuring (CLI, SNMP, NETCONF).</li>
   </ul>
   <h4><span class="dot"></span>Traditional vs SDN</h4>
   <table class="kt"><tr><th></th><th>Traditional</th><th>SDN / Controller</th></tr>
   <tr><td>Control plane</td><td>Distributed (each box)</td><td>Centralized on controller</td></tr>
   <tr><td>Config</td><td>Box-by-box CLI</td><td>Intent via controller GUI/API</td></tr>
   <tr><td>Programmability</td><td>Limited (SNMP set, EEM)</td><td>Full REST/NETCONF APIs</td></tr></table>
   <h4><span class="dot"></span>API direction</h4>
   <p class="b"><strong>Northbound</strong> = up from controller to applications/scripts (REST, used to <em>tell</em> the controller intent). <strong>Southbound</strong> = down from controller to network devices (OpenFlow, NETCONF, OpFlex — used to <em>program</em> the data plane).</p>
   <div class="note key"><span class="i">🔑</span><div>Catalyst Center (formerly DNA Center) is Cisco's enterprise SDN controller. APIC is the controller for ACI (data center fabric).</div></div>`},

  {ico:"🌍",title:"REST APIs & Data Formats",sub:"HTTP verbs, status codes, JSON/XML/YAML",
   html:`
   <div class="lead">REST is the lingua franca of automation. Verbs are HTTP methods, resources are URLs, payloads are JSON.</div>
   <h4><span class="dot"></span>HTTP verbs (CRUD)</h4>
   <table class="kt"><tr><th>Verb</th><th>Maps to</th><th>Use</th></tr>
   <tr><td>GET</td><td>Read</td><td>Retrieve resource (safe, idempotent)</td></tr>
   <tr><td>POST</td><td>Create</td><td>Create new resource</td></tr>
   <tr><td>PUT</td><td>Update / Replace</td><td>Replace entire resource</td></tr>
   <tr><td>PATCH</td><td>Modify</td><td>Partial update</td></tr>
   <tr><td>DELETE</td><td>Delete</td><td>Remove resource</td></tr></table>
   <h4><span class="dot"></span>Status codes</h4>
   <table class="kt"><tr><th>Code</th><th>Meaning</th></tr>
   <tr><td>2xx</td><td>Success (200 OK, 201 Created, 204 No Content)</td></tr>
   <tr><td>3xx</td><td>Redirect</td></tr>
   <tr><td>4xx</td><td>Client error (400 Bad Request, 401 Unauth, 403 Forbidden, 404 Not Found)</td></tr>
   <tr><td>5xx</td><td>Server error (500 Internal, 503 Unavailable)</td></tr></table>
   <h4><span class="dot"></span>JSON (you must read this fluently)</h4>
   <pre><code>{
  "interface": {
    "name": "GigabitEthernet0/1",
    "description": "Uplink to core",
    "ip": "10.0.0.1",
    "mask": "255.255.255.252",
    "enabled": true
  },
  "vlans": [10, 20, 30]
}</code></pre>
   <h4><span class="dot"></span>YAML</h4>
   <pre><code>interface:
  name: GigabitEthernet0/1
  description: Uplink to core
  ip: 10.0.0.1
  mask: 255.255.255.252
  enabled: true
vlans:
  - 10
  - 20
  - 30</code></pre>
   <p class="b">XML uses tags: <code>&lt;interface&gt;&lt;name&gt;Gi0/1&lt;/name&gt;&lt;/interface&gt;</code>. NETCONF uses XML; REST mostly uses JSON.</p>`},

  {ico:"⚙️",title:"Config Management — Ansible, Puppet, Chef",sub:"Agentless vs agent, push vs pull, declarative",
   html:`
   <div class="lead">Config management tools maintain device state. Define what you want; the tool makes the device match.</div>
   <table class="kt"><tr><th></th><th>Ansible</th><th>Puppet</th><th>Chef</th></tr>
   <tr><td>Language</td><td>YAML (playbooks)</td><td>Puppet DSL (Ruby-like)</td><td>Ruby (recipes)</td></tr>
   <tr><td>Agent</td><td><b>Agentless</b> (SSH/API)</td><td>Agent on node</td><td>Agent on node</td></tr>
   <tr><td>Model</td><td>Push from control node</td><td>Pull from master</td><td>Pull from server</td></tr>
   <tr><td>Port</td><td>SSH 22</td><td>TCP 8140</td><td>TCP 10002</td></tr></table>
   <h4><span class="dot"></span>Idempotent & declarative</h4>
   <p class="b"><strong>Idempotent</strong> — running the same playbook twice yields the same state; no double-applying. <strong>Declarative</strong> — you describe the end state, not the steps. ("Interface Gi0/1 should be up with IP X" — the tool decides how.)</p>
   <h4><span class="dot"></span>Ansible playbook example</h4>
   <pre><code>- name: Configure access port
  hosts: switches
  tasks:
    - name: Set Gi0/1 in VLAN 10
      ios_config:
        lines:
          - switchport mode access
          - switchport access vlan 10
        parents: interface GigabitEthernet0/1</code></pre>`},

  {ico:"🪢",title:"Underlay, Overlay & Fabric — SD-Access",sub:"VXLAN, LISP, control vs data",
   html:`
   <div class="lead">Modern campus and DC networks are split into two layers: a physical underlay and a logical overlay.</div>
   <ul class="l">
   <li><strong>Underlay</strong> — physical IP routing among switches (OSPF/IS-IS). Just provides reachability between fabric nodes.</li>
   <li><strong>Overlay</strong> — virtual tunnels that carry user traffic, encapsulated (VXLAN). Provides segmentation and mobility.</li>
   </ul>
   <h4><span class="dot"></span>Cisco SD-Access roles</h4>
   <table class="kt"><tr><th>Role</th><th>Job</th></tr>
   <tr><td>Edge node</td><td>Where users plug in</td></tr>
   <tr><td>Border node</td><td>Connects fabric to outside (Internet/WAN)</td></tr>
   <tr><td>Control plane node</td><td>LISP database — knows who is where</td></tr>
   <tr><td>Catalyst Center</td><td>The controller; intent-based mgmt</td></tr></table>
   <div class="note tip"><span class="i">💡</span><div>VXLAN encapsulates Ethernet frames in UDP/4789 — gives 16 million segments (24-bit VNI) vs 4094 VLANs.</div></div>`},

  {ico:"🧪",title:"AI / ML in Networking",sub:"v1.1 topic — what to know",
   html:`
   <div class="lead">CCNA 200-301 v1.1 (added 2024) introduces basic AI/ML concepts. You won't write models — you need to recognize use cases.</div>
   <h4><span class="dot"></span>Use cases</h4>
   <ul class="l">
   <li><strong>Anomaly detection</strong> — ML baselines normal traffic and alerts on deviations (DDoS, lateral movement).</li>
   <li><strong>Predictive analytics</strong> — forecast capacity, failure (drive replacement before crash).</li>
   <li><strong>AIOps</strong> — root-cause analysis across thousands of logs faster than humans.</li>
   <li><strong>Self-healing</strong> — controller auto-remediates known issues.</li>
   <li><strong>Endpoint classification</strong> — ML identifies device types from traffic patterns.</li>
   </ul>
   <h4><span class="dot"></span>Generative AI</h4>
   <p class="b">LLMs are now used to generate configs, summarize logs, and translate intent into CLI. The networker still validates.</p>`},

  {ico:"🧱",title:"Terraform & Infrastructure as Code",sub:"v1.1 — declarative IaC for networks",
   html:`
   <div class="lead">Terraform extends config management into provisioning: not just configuring devices but creating them (cloud VPCs, ACI tenants, Meraki networks).</div>
   <h4><span class="dot"></span>Concepts</h4>
   <ul class="l">
   <li><strong>HCL</strong> — HashiCorp Configuration Language. Declarative; .tf files.</li>
   <li><strong>Provider</strong> — plugin for a target (AWS, Cisco ACI, NX-OS, Meraki).</li>
   <li><strong>State file</strong> — terraform.tfstate; what Terraform thinks exists.</li>
   <li><strong>Plan</strong> — <code>terraform plan</code> shows diff; <code>apply</code> executes; <code>destroy</code> removes.</li>
   </ul>
   <pre><code>resource "meraki_network" "branch1" {
  organization_id = var.org_id
  name            = "Branch1"
  type            = "appliance"
  tags            = ["branch", "production"]
}</code></pre>
   <h4><span class="dot"></span>Declarative vs imperative</h4>
   <p class="b"><strong>Declarative</strong> (Terraform, Ansible) — describe end state. <strong>Imperative</strong> (Python script, bash) — list steps. Declarative is the modern standard because it's idempotent and self-documenting.</p>`},
 ]},

 {id:"cli", name:"CLI & IOS Mastery", icon:"💻", domain:"x", weight:0,
  blurb:"Modes, troubleshooting workflow, boot sequence, password recovery, and the command reference.",
  cards:[
  {ico:"⌨️",title:"IOS CLI Modes & Movement",sub:"User → Privileged → Global → Specific",
   html:`
   <div class="lead">Every command lives in a mode. You can't configure an interface from user mode. Memorize the prompts.</div>
   <table class="kt"><tr><th>Mode</th><th>Prompt</th><th>Enter With</th></tr>
   <tr><td>User EXEC</td><td><code>R1></code></td><td>Login</td></tr>
   <tr><td>Privileged EXEC</td><td><code>R1#</code></td><td><code>enable</code></td></tr>
   <tr><td>Global Config</td><td><code>R1(config)#</code></td><td><code>configure terminal</code></td></tr>
   <tr><td>Interface</td><td><code>R1(config-if)#</code></td><td><code>interface gi0/1</code></td></tr>
   <tr><td>Line</td><td><code>R1(config-line)#</code></td><td><code>line vty 0 4</code></td></tr>
   <tr><td>Router</td><td><code>R1(config-router)#</code></td><td><code>router ospf 1</code></td></tr>
   <tr><td>VLAN</td><td><code>R1(config-vlan)#</code></td><td><code>vlan 10</code></td></tr></table>
   <h4><span class="dot"></span>Navigation</h4>
   <ul class="l">
   <li><code>exit</code> — back one mode.</li><li><code>end</code> or <code>Ctrl-Z</code> — straight to privileged.</li>
   <li><code>?</code> — context help. <code>show ?</code> lists every show option.</li>
   <li><code>Tab</code> completes commands. <code>do</code> runs an EXEC command from config mode (<code>do show ip int br</code>).</li>
   <li><code>Ctrl-A</code> beginning of line. <code>Ctrl-E</code> end. <code>Ctrl-U</code> erase line.</li>
   </ul>
   <div class="note tip"><span class="i">💡</span><div>Save your work: <code>copy running-config startup-config</code> (or <code>write memory</code> / <code>wr</code>).</div></div>`},

  {ico:"🩺",title:"Troubleshooting Methodology",sub:"OSI bottom-up, structured approach",
   html:`
   <div class="lead">Random poking is the slowest way to fix a network. Structure beats speed.</div>
   <h4><span class="dot"></span>The seven steps</h4>
   <ol class="l">
   <li><strong>Define the problem</strong> — get specifics: "what works, what doesn't, since when, what changed?"</li>
   <li><strong>Gather information</strong> — show commands, logs, customer narrative.</li>
   <li><strong>Analyze</strong> — narrow scope. Is it one user, one VLAN, the whole site?</li>
   <li><strong>Eliminate causes</strong> — bottom-up (cable, link, IP, route, app) or top-down (app, DNS, …).</li>
   <li><strong>Hypothesize</strong> — most likely root cause.</li>
   <li><strong>Test</strong> — make one change, verify.</li>
   <li><strong>Document & escalate</strong> — close the ticket properly.</li>
   </ol>
   <h4><span class="dot"></span>The reliable show-command stack</h4>
   <pre><code>show ip interface brief         ! L1/L2/L3 status at a glance
show interfaces gi0/1           ! errors, CRCs, input queue
show ip route                   ! is the destination known?
show cdp neighbors detail       ! who's on the other end?
show arp                        ! L2-to-L3 resolution
show mac address-table          ! is MAC learned on expected port?
ping / traceroute               ! path test
show logging                    ! the answer is often already here</code></pre>`},

  {ico:"⚡",title:"Router Boot Sequence & Memory",sub:"POST → bootstrap → IOS → config",
   html:`
   <div class="lead">A router goes through four phases at every power-on. Knowing them tells you where to look when boot fails.</div>
   <h4><span class="dot"></span>The four phases</h4>
   <ol class="l">
   <li><strong>POST</strong> (Power-On Self Test) — hardware check. Stored in ROM.</li>
   <li><strong>Bootstrap</strong> — small program in ROM that loads the IOS.</li>
   <li><strong>IOS image</strong> — typically loaded from Flash (compressed .bin).</li>
   <li><strong>Startup config</strong> — loaded from NVRAM into RAM (becomes running-config).</li>
   </ol>
   <h4><span class="dot"></span>Memory types</h4>
   <table class="kt"><tr><th>Memory</th><th>Holds</th><th>Volatile?</th></tr>
   <tr><td>ROM</td><td>POST, bootstrap, ROMMON, mini-IOS</td><td>No</td></tr>
   <tr><td>Flash</td><td>IOS image(s)</td><td>No</td></tr>
   <tr><td>NVRAM</td><td>startup-config</td><td>No</td></tr>
   <tr><td>RAM</td><td>running-config, ARP table, routing table, packet buffers</td><td>Yes</td></tr></table>
   <h4><span class="dot"></span>Configuration register</h4>
   <p class="b"><strong>0x2102</strong> — normal boot (Flash, load startup-config). <strong>0x2142</strong> — ignore startup-config (used for password recovery).</p>`},

  {ico:"🔑",title:"Password Recovery",sub:"Console + ROMMON + 0x2142",
   html:`
   <div class="lead">If you forget the enable password, you don't reformat — you bypass the startup config.</div>
   <h4><span class="dot"></span>Steps (router)</h4>
   <ol class="l">
   <li>Console in. Power-cycle. Send <strong>Break</strong> during the first 60 seconds to enter ROMMON.</li>
   <li>At rommon&gt;: <code>confreg 0x2142</code> then <code>reset</code>.</li>
   <li>Router boots, ignoring startup-config. Skip setup dialog.</li>
   <li><code>enable</code>, then <code>copy startup-config running-config</code> (you now have the old config <em>without</em> being locked out).</li>
   <li>Reset passwords: <code>enable secret NewPass!</code>, <code>line vty 0 4</code> / <code>login local</code>, etc.</li>
   <li>Restore: <code>config-register 0x2102</code>.</li>
   <li><code>copy running-config startup-config</code>. <code>reload</code>.</li>
   </ol>
   <div class="note warn"><span class="i">⚠️</span><div>Physical access = full control. This is why physical security of network gear matters.</div></div>`},

  {ico:"💾",title:"IOS Image Management",sub:"Naming, upgrade, verify",
   html:`
   <div class="lead">IOS filenames encode platform, feature set, version, and image type.</div>
   <p class="b"><code>c2900-universalk9-mz.SPA.157-3.M5.bin</code></p>
   <ul class="l">
   <li><b>c2900</b> — platform (Cisco 2900).</li>
   <li><b>universalk9</b> — feature set (with strong crypto).</li>
   <li><b>mz</b> — runs from RAM, compressed.</li>
   <li><b>SPA</b> — digitally signed.</li>
   <li><b>157-3.M5</b> — version.</li>
   </ul>
   <h4><span class="dot"></span>Upgrade workflow</h4>
   <pre><code>copy tftp: flash:                ! transfer new image
verify /md5 flash:c2900-...M5.bin <expected-hash>
boot system flash:c2900-...M5.bin
write memory
reload</code></pre>`},

  {ico:"📘",title:"Master Command Reference",sub:"The shortest list that gets you through the exam",
   html:`
   <div class="lead">If you can produce these from memory, you can configure 90% of CCNA labs.</div>
   <h4><span class="dot"></span>Basic device</h4>
   <pre><code>hostname R1
enable secret NewSecret!
service password-encryption
no ip domain-lookup
banner motd ^Authorized users only.^
clock timezone PST -8
line con 0
 logging synchronous
 exec-timeout 5 0
 login local</code></pre>
   <h4><span class="dot"></span>Interface</h4>
   <pre><code>interface gi0/1
 description Uplink to Core
 ip address 10.0.0.1 255.255.255.0
 no shutdown
 mdix auto</code></pre>
   <h4><span class="dot"></span>VLAN / trunk</h4>
   <pre><code>vlan 10
 name USERS
interface gi0/1
 switchport mode access
 switchport access vlan 10
interface gi0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99</code></pre>
   <h4><span class="dot"></span>OSPF</h4>
   <pre><code>router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface gi0/0
 network 10.0.0.0 0.0.0.255 area 0
interface gi0/0
 ip ospf network point-to-point
 ip ospf cost 10</code></pre>
   <h4><span class="dot"></span>Static / default route</h4>
   <pre><code>ip route 0.0.0.0 0.0.0.0 192.0.2.1     ! default
ip route 10.5.0.0 255.255.0.0 10.0.0.2 ! specific</code></pre>
   <h4><span class="dot"></span>NAT / DHCP / SSH (the trio)</h4>
   <pre><code>ip nat inside source list 1 interface g0/1 overload
ip dhcp pool LAN
 network 10.1.1.0 /24
 default-router 10.1.1.1
hostname R1
ip domain-name lab.local
crypto key generate rsa modulus 2048
line vty 0 4
 transport input ssh
 login local</code></pre>
   <h4><span class="dot"></span>Verification</h4>
   <pre><code>show ip interface brief
show interfaces gi0/1
show running-config | section interface
show vlan brief
show interfaces trunk
show spanning-tree
show ip route
show ip ospf neighbor
show ip protocols
show cdp neighbors detail
show mac address-table
show port-security
show ip nat translations
show logging</code></pre>`},
 ]},

 {id:"arch", name:"Design & Cloud", icon:"🏛️", domain:"x", weight:0,
  blurb:"2/3-tier campus, spine-leaf, WAN types, cloud and virtualization.",
  cards:[
  {ico:"🧱",title:"Campus Hierarchy — 2-tier & 3-tier",sub:"Access, Distribution, Core",
   html:`
   <div class="lead">Cisco's three-tier model is the foundation of every campus design question.</div>
   <h4><span class="dot"></span>The layers</h4>
   <ul class="l">
   <li><strong>Access</strong> — where endpoints connect. PoE, port security, VLANs.</li>
   <li><strong>Distribution</strong> — aggregates access; inter-VLAN routing, ACLs, redundancy.</li>
   <li><strong>Core</strong> — high-speed backbone; minimal logic; just forwards fast.</li>
   </ul>
   <p class="b"><strong>Collapsed core (2-tier)</strong> — small/medium campus combines distribution and core into one layer. Saves cost; sacrifices some scalability.</p>
   <h4><span class="dot"></span>Spine-leaf (modern data center)</h4>
   <p class="b">Every leaf connects to every spine. ECMP for east-west traffic. Predictable two-hop latency between any two servers. Used in modern DC + SD-Access fabrics.</p>`},

  {ico:"🌎",title:"WAN Connectivity Options",sub:"MPLS, Metro Ethernet, Internet VPN, leased line",
   html:`
   <div class="lead">CCNA expects you to recognize WAN types and pick the right one for the scenario.</div>
   <table class="kt"><tr><th>Type</th><th>Description</th><th>Pros/Cons</th></tr>
   <tr><td>Leased line</td><td>Dedicated point-to-point (T1/E1/T3)</td><td>Reliable; expensive</td></tr>
   <tr><td>MPLS L3 VPN</td><td>Provider routes between sites</td><td>QoS guaranteed; flexible</td></tr>
   <tr><td>Metro Ethernet</td><td>L2 over fiber across a city</td><td>High BW; native VLANs</td></tr>
   <tr><td>Internet VPN (DMVPN/IPsec)</td><td>Tunnels over the internet</td><td>Cheap; variable performance</td></tr>
   <tr><td>SD-WAN</td><td>Controller-managed overlay across many transports</td><td>Per-app routing; modern default</td></tr>
   <tr><td>Cellular (LTE/5G)</td><td>Wireless WAN backup or primary</td><td>Fast deploy; data caps</td></tr></table>`},

  {ico:"☁️",title:"Cloud & Virtualization",sub:"VMs, containers, IaaS/PaaS/SaaS",
   html:`
   <div class="lead">CCNA assumes you can speak fluent cloud at a foundational level.</div>
   <h4><span class="dot"></span>Service models</h4>
   <table class="kt"><tr><th>Model</th><th>You manage</th><th>Provider manages</th><th>Example</th></tr>
   <tr><td>IaaS</td><td>OS, apps, data</td><td>Hardware, hypervisor, network</td><td>AWS EC2, Azure VM</td></tr>
   <tr><td>PaaS</td><td>App, data</td><td>OS, runtime, middleware</td><td>App Engine, Heroku</td></tr>
   <tr><td>SaaS</td><td>Just data/config</td><td>Everything else</td><td>Office 365, Salesforce</td></tr></table>
   <h4><span class="dot"></span>Deployment models</h4>
   <ul class="l">
   <li><strong>Public</strong> — provider's infra, shared.</li><li><strong>Private</strong> — your data center / dedicated cloud tenant.</li>
   <li><strong>Hybrid</strong> — mix; connected via VPN or Direct Connect.</li><li><strong>Community</strong> — shared between specific orgs (e.g., government).</li>
   </ul>
   <h4><span class="dot"></span>VMs vs Containers</h4>
   <table class="kt"><tr><th></th><th>VM</th><th>Container</th></tr>
   <tr><td>Isolation</td><td>Full OS</td><td>Process-level (shared kernel)</td></tr>
   <tr><td>Boot</td><td>Minutes</td><td>Seconds</td></tr>
   <tr><td>Size</td><td>GBs</td><td>MBs</td></tr>
   <tr><td>Density</td><td>Low</td><td>Very high</td></tr></table>
   <h4><span class="dot"></span>Hypervisors</h4>
   <p class="b"><strong>Type 1 (bare metal)</strong> — runs directly on hardware: ESXi, Hyper-V, KVM. <strong>Type 2 (hosted)</strong> — runs on an OS: VMware Workstation, VirtualBox.</p>`},

  {ico:"🔌",title:"Connecting to the Cloud",sub:"Public internet, VPN, Direct Connect, vRouter",
   html:`
   <div class="lead">Cloud is just someone else's data center — and getting traffic to it is its own design question.</div>
   <ul class="l">
   <li><strong>Public internet</strong> — cheapest, variable performance, fine for SaaS.</li>
   <li><strong>Site-to-site VPN</strong> — IPsec over the internet to cloud VPC.</li>
   <li><strong>Direct connect / ExpressRoute</strong> — private circuit from your DC to the cloud edge. Consistent, low-latency, but costly.</li>
   <li><strong>Virtual router (CSR1000v, Catalyst 8000v)</strong> — runs IOS-XE inside the cloud VPC for routing/IPsec.</li>
   </ul>`},
 ]},

 {id:"labs", name:"Hands-On Labs", icon:"🧪", domain:"x", weight:0,
  blurb:"23 guided labs covering every configuration topic on the exam. Build them in Packet Tracer, EVE-NG, or CML.",
  cards:[
  {ico:"🏗️",title:"Lab 01 — Initial Device Setup",sub:"Hostname, banner, console, SSH",
   html:`
   <div class="lead">Every device, every time: name it, harden console, enable SSH, save.</div>
   <pre><code>enable
configure terminal
hostname R1
no ip domain-lookup
ip domain-name lab.local
crypto key generate rsa modulus 2048
username admin privilege 15 secret CiscoCCNA!
enable algorithm-type scrypt secret EnableCCNA!
service password-encryption
banner motd ^Authorized Access Only^
line con 0
 login local
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
end
copy running-config startup-config</code></pre>
   <p class="b"><strong>Verify:</strong> <code>show running-config | include hostname|username|ssh</code>, then SSH in from a remote host.</p>`},

  {ico:"🧮",title:"Lab 02 — VLSM Subnet Design",sub:"Address a topology efficiently",
   html:`
   <div class="lead">Given a /24, address: HQ 100 hosts, Branch 50 hosts, Server farm 25 hosts, three P2P WAN links.</div>
   <ol class="l">
   <li>Sort largest → smallest. HQ needs 100 → /25 (126 hosts). Branch 50 → /26. Servers 25 → /27. WAN /30 × 3.</li>
   <li>Start at 10.1.1.0. HQ: <strong>10.1.1.0/25</strong> (0–127).</li>
   <li>Branch: <strong>10.1.1.128/26</strong> (128–191).</li>
   <li>Servers: <strong>10.1.1.192/27</strong> (192–223).</li>
   <li>WAN1: <strong>10.1.1.224/30</strong>; WAN2: <strong>.228/30</strong>; WAN3: <strong>.232/30</strong>.</li>
   <li>Document. Apply to interfaces.</li>
   </ol>`},

  {ico:"🚪",title:"Lab 03 — VLANs & Trunking",sub:"Access ports, dot1Q trunk, allowed list",
   html:`
   <pre><code>! SW1
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MGMT
interface range fa0/1 - 10
 switchport mode access
 switchport access vlan 10
interface fa0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
interface vlan 99
 ip address 10.99.0.10 255.255.255.0
ip default-gateway 10.99.0.1</code></pre>
   <p class="b">Verify: <code>show vlan brief</code>, <code>show interfaces trunk</code>.</p>`},

  {ico:"🔀",title:"Lab 04 — Inter-VLAN Routing (Router-on-a-Stick)",sub:"Subinterfaces + 802.1Q",
   html:`
   <pre><code>! Router
interface gi0/0
 no shutdown
interface gi0/0.10
 encapsulation dot1q 10
 ip address 10.10.0.1 255.255.255.0
interface gi0/0.20
 encapsulation dot1q 20
 ip address 10.20.0.1 255.255.255.0
interface gi0/0.99
 encapsulation dot1q 99 native
 ip address 10.99.0.1 255.255.255.0

! Switch uplink
interface fa0/24
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 99</code></pre>
   <p class="b">Modern alternative: configure SVIs on a Layer-3 switch. <code>interface vlan 10 / ip address ...</code>.</p>`},

  {ico:"🛣️",title:"Lab 05 — Static & Default Routes",sub:"Plus floating static",
   html:`
   <pre><code>! Primary default to ISP
ip route 0.0.0.0 0.0.0.0 203.0.113.1

! Specific static
ip route 10.5.0.0 255.255.0.0 10.0.0.2

! Floating static (AD 200) for backup link
ip route 0.0.0.0 0.0.0.0 198.51.100.1 200</code></pre>
   <p class="b">A floating static has an AD higher than the primary so it sits in routing table only when the primary goes away.</p>`},

  {ico:"📐",title:"Lab 06 — OSPF Single-Area",sub:"Process, RID, networks, passive",
   html:`
   <pre><code>router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface gi0/0
 network 10.0.0.0 0.0.0.255 area 0
 network 10.0.1.0 0.0.0.255 area 0
interface gi0/0
 ip ospf network point-to-point</code></pre>
   <p class="b">Verify: <code>show ip ospf neighbor</code>, <code>show ip route ospf</code>, <code>show ip ospf interface brief</code>.</p>`},

  {ico:"🎛️",title:"Lab 07 — OSPF Tuning",sub:"Cost, priority, hello/dead",
   html:`
   <pre><code>interface gi0/1
 ip ospf cost 5            ! influence path selection
 ip ospf priority 200      ! win DR election
 ip ospf hello-interval 5  ! must match neighbors!
 ip ospf dead-interval 20</code></pre>
   <div class="note warn"><span class="i">⚠️</span><div>Hello/dead must match on both ends or adjacency stalls in INIT/2WAY.</div></div>`},

  {ico:"🔗",title:"Lab 08 — EtherChannel (LACP)",sub:"Bundle uplinks for bandwidth + redundancy",
   html:`
   <pre><code>interface range gi0/1 - 2
 channel-group 1 mode active
interface port-channel 1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99</code></pre>
   <p class="b">Verify: <code>show etherchannel summary</code> — look for <strong>SU</strong> (in use). Modes: <code>active</code>/<code>passive</code> = LACP, <code>desirable</code>/<code>auto</code> = PAgP, <code>on</code> = static.</p>`},

  {ico:"🌳",title:"Lab 09 — STP Root Bridge",sub:"Primary, secondary, verify",
   html:`
   <pre><code>! Make SW1 the root for VLAN 10 and secondary for 20
spanning-tree vlan 10 root primary
spanning-tree vlan 20 root secondary
spanning-tree mode rapid-pvst</code></pre>
   <p class="b">Verify: <code>show spanning-tree vlan 10</code> — look for "We are the root" line.</p>`},

  {ico:"📬",title:"Lab 10 — DHCP Server & Relay",sub:"Pool, exclusions, helper",
   html:`
   <pre><code>! Server (R1)
ip dhcp excluded-address 10.10.0.1 10.10.0.10
ip dhcp pool USERS
 network 10.10.0.0 /24
 default-router 10.10.0.1
 dns-server 8.8.8.8 1.1.1.1
 lease 7

! Relay (R2)
interface vlan 20
 ip helper-address 10.10.0.1</code></pre>
   <p class="b">Verify: <code>show ip dhcp binding</code>, <code>show ip dhcp pool</code>.</p>`},

  {ico:"🔁",title:"Lab 11 — NAT Overload (PAT)",sub:"Many users, one public IP",
   html:`
   <pre><code>access-list 1 permit 192.168.1.0 0.0.0.255
ip nat inside source list 1 interface g0/1 overload
interface g0/0
 ip nat inside
interface g0/1
 ip nat outside</code></pre>
   <p class="b">Verify: <code>show ip nat translations</code> — entries show src port mapping.</p>`},

  {ico:"📌",title:"Lab 12 — Static NAT",sub:"Publish a server to the internet",
   html:`
   <pre><code>ip nat inside source static 192.168.1.10 203.0.113.10
interface g0/0
 ip nat inside
interface g0/1
 ip nat outside</code></pre>`},

  {ico:"🚧",title:"Lab 13 — Standard ACL",sub:"Allow one subnet, deny others",
   html:`
   <pre><code>ip access-list standard SALES-OUT
 permit 10.1.10.0 0.0.0.255
 deny any
interface gi0/0
 ip access-group SALES-OUT out</code></pre>
   <p class="b">Place standard ACLs close to <em>destination</em>.</p>`},

  {ico:"🛡️",title:"Lab 14 — Extended ACL",sub:"Allow web, deny everything else inbound",
   html:`
   <pre><code>ip access-list extended WEB-ONLY
 permit tcp any host 10.0.0.10 eq 80
 permit tcp any host 10.0.0.10 eq 443
 permit icmp any host 10.0.0.10 echo-reply
 deny ip any any log
interface gi0/1
 ip access-group WEB-ONLY in</code></pre>
   <p class="b">Place extended ACLs close to <em>source</em>.</p>`},

  {ico:"🔒",title:"Lab 15 — Port Security",sub:"Sticky MAC, restrict mode",
   html:`
   <pre><code>interface range fa0/1 - 20
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 switchport port-security aging time 60</code></pre>
   <p class="b">Verify: <code>show port-security</code>, <code>show port-security interface fa0/1</code>.</p>`},

  {ico:"🏰",title:"Lab 16 — Switch Hardening",sub:"BPDU guard, DHCP snooping, DAI",
   html:`
   <pre><code>! Edge port protection
interface range fa0/1 - 23
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable

! DHCP snooping
ip dhcp snooping
ip dhcp snooping vlan 10,20
interface gi0/24
 ip dhcp snooping trust

! DAI
ip arp inspection vlan 10,20
interface gi0/24
 ip arp inspection trust</code></pre>`},

  {ico:"🦸",title:"Lab 17 — HSRP",sub:"First-hop redundancy",
   html:`
   <pre><code>! R1
interface vlan 10
 ip address 10.10.0.2 255.255.255.0
 standby 10 ip 10.10.0.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 version 2

! R2
interface vlan 10
 ip address 10.10.0.3 255.255.255.0
 standby 10 ip 10.10.0.1
 standby 10 priority 100
 standby 10 version 2</code></pre>
   <p class="b">Verify: <code>show standby brief</code>. Hosts use <code>10.10.0.1</code> as gateway.</p>`},

  {ico:"6️⃣",title:"Lab 18 — IPv6 Addressing & SLAAC",sub:"Link-local, GUA, RA",
   html:`
   <pre><code>ipv6 unicast-routing
interface gi0/0
 ipv6 address 2001:db8:0:10::1/64
 ipv6 address fe80::1 link-local
 no shutdown
! Hosts derive their own /64 address via Router Advertisements
! Verify: show ipv6 interface brief</code></pre>`},

  {ico:"🗺️",title:"Lab 19 — IPv6 Static Routing & OSPFv3",sub:"Routing v6",
   html:`
   <pre><code>! Static
ipv6 route 2001:db8:0:20::/64 2001:db8:ffff::2

! OSPFv3 (per-interface activation)
ipv6 router ospf 1
 router-id 1.1.1.1
interface gi0/0
 ipv6 ospf 1 area 0</code></pre>`},

  {ico:"⚙️",title:"Lab 20 — IP Services Stack",sub:"NTP, DNS, Syslog, SNMP",
   html:`
   <pre><code>ntp server 132.163.97.1
clock timezone PST -8

ip name-server 8.8.8.8 1.1.1.1
ip domain-lookup

logging host 10.0.0.50
logging trap warnings
service timestamps log datetime msec

snmp-server community RO_STRING ro
snmp-server location DC-Rack3
snmp-server host 10.0.0.50 version 2c RO_STRING</code></pre>`},

  {ico:"📶",title:"Lab 21 — Wireless WLC Foundation",sub:"WLAN, security, AP onboarding",
   html:`
   <div class="lead">On the WLC GUI: create a WLAN, map SSID to interface (VLAN), set security WPA2/WPA3-Enterprise pointing to RADIUS.</div>
   <ul class="l">
   <li>WLANs → New → SSID "Corp", profile "Corp".</li>
   <li>General → Status Enabled, Interface "VLAN10".</li>
   <li>Security → Layer 2 → WPA2+WPA3; AKM 802.1X.</li>
   <li>AAA Servers → RADIUS ISE.</li>
   <li>QoS → Platinum (voice) or Gold (video).</li>
   <li>Apply. APs broadcast.</li>
   </ul>`},

  {ico:"📡",title:"Lab 22 — Lightweight AP Discovery",sub:"CAPWAP, DHCP option 43",
   html:`
   <div class="lead">An AP discovers a WLC by: previously-known controller, DNS (CISCO-CAPWAP-CONTROLLER), DHCP option 43, broadcast.</div>
   <pre><code>! DHCP option 43 pointing APs at WLC 10.0.0.5
ip dhcp pool AP-VLAN
 network 10.30.0.0 /24
 default-router 10.30.0.1
 option 43 hex f104.0a00.0005</code></pre>
   <p class="b">Hex format: f1 (suboption) + 04 (length) + 4 bytes of WLC IP.</p>`},

  {ico:"🧰",title:"Lab 23 — Full Troubleshooting Workflow",sub:"User says: 'the internet is broken'",
   html:`
   <div class="lead">A realistic ticket. Walk it bottom-up.</div>
   <ol class="l">
   <li>L1: <code>show interfaces gi0/0</code> — is it up/up? CRC errors?</li>
   <li>L2: <code>show mac address-table</code>, <code>show interfaces trunk</code>, <code>show spanning-tree</code>.</li>
   <li>L3: <code>show ip interface brief</code>, <code>show ip route 0.0.0.0</code>. Default route present?</li>
   <li>Path: <code>ping 8.8.8.8</code> from router. If router pings, internet works → look at PC. If router can't, look up.</li>
   <li>Name resolution: <code>ping www.google.com</code>. If IP works but name fails → DNS.</li>
   <li>NAT: <code>show ip nat translations</code>. Translation building?</li>
   <li>ACL: <code>show access-lists</code>. Hit counters increasing on a deny?</li>
   <li>Logs: <code>show logging | include %</code>.</li>
   </ol>`},
 ]},

   explain:"/25 → .128. Block = 128. Networks .0 and .128. 130 → .128."},

    domainScores: {D1:{c:0,t:0},D2:{c:0,t:0},D3:{c:0,t:0},D4:{c:0,t:0},D5:{c:0,t:0},D6:{c:0,t:0}},

    streak: 0

  flash: {order:[], idx:0, flipped:false, known:{}, source:'glossary'}

async function loadProgress(){
  try{
    const r = await window.storage.get('ccna_progress');
    if(r && r.value){
      const p = JSON.parse(r.value);
      // shallow merge, preserve defaults if missing keys
      Object.keys(p).forEach(k=>{
        if(k==='domainScores'){
          Object.keys(p.domainScores||{}).forEach(d=>{
            if(STATE.progress.domainScores[d]) STATE.progress.domainScores[d]=p.domainScores[d];
          });
        } else STATE.progress[k]=p[k];
      });
    }
  }catch(e){}
}
async function saveProgress(){
  try{ await window.storage.set('ccna_progress', JSON.stringify(STATE.progress)); }
  catch(e){ console.warn('save failed',e); }
}

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function daysBetween(a,b){
  const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number);
  return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000);
}
async function updateStreak(){
  const today=todayStr();
  if(!STATE.progress.lastVisit){ STATE.progress.streak=1; }
  else if(STATE.progress.lastVisit!==today){
    const gap=daysBetween(STATE.progress.lastVisit,today);
    if(gap===1) STATE.progress.streak++;
    else if(gap>1) STATE.progress.streak=1;
  }
  STATE.progress.lastVisit=today;
  await saveProgress();
}

function showPage(id){

function chapterPageHTML(chapId, headHTML){
  const ch = CH.find(c=>c.id===chapId);
  if(!ch) return headHTML+'<p>Chapter not found.</p>';
  const dom = ch.domain;
  const isExam = ['1','2','3','4','5','6'].includes(dom);
  const cards = ch.cards;
  const doneCt = cards.filter((_,i)=>STATE.progress.cardsDone[chapId+'-'+i]).length;
  const pct = cards.length?Math.round(doneCt/cards.length*100):0;
  const pillCls = isExam?`d${dom}`:'d1';
  const blurb = `<p class="page-blurb">${escapeHtml(ch.blurb)}</p>`;
  const meter = isExam ? `

  const body = cards.map((c,i)=>cardHTML(ch,c,i)).join('');

function cardHTML(ch, card, idx){
  const cid = ch.id+'-'+idx;
  const isOpen = STATE.progress.cardsOpened[cid];
  const isDone = STATE.progress.cardsDone[cid];
  const domPill = ['1','2','3','4','5','6'].includes(ch.domain) ? `<span class="dom-pill d${ch.domain}" style="margin-right:8px">D${ch.domain}</span>` : '';
  return `<article class="card${isOpen?' open':''}${isDone?' done':''}" data-cid="${cid}">
    <div class="card-head" onclick="toggleCard('${cid}')">
      <div class="card-ico" style="background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px">${card.ico||'📌'}</div>
      <h3>${domPill}${escapeHtml(card.title)}${card.sub?`<span class="sub">${escapeHtml(card.sub)}</span>`:''}</h3>
      <svg class="card-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="card-body">${card.html||''}</div>
    <button class="card-mark" onclick="event.stopPropagation();toggleDone('${cid}')">${isDone?'✓ Studied':'Mark Studied'}</button>
  </article>`;
}

async function toggleCard(cid){
  const card = document.querySelector(`.card[data-cid="${cid}"]`);
  if(!card) return;
  const wasOpen = card.classList.toggle('open');
  if(wasOpen) STATE.progress.cardsOpened[cid]=true;
  else delete STATE.progress.cardsOpened[cid];
  await saveProgress();
}

async function toggleDone(cid){
  const card = document.querySelector(`.card[data-cid="${cid}"]`);
  if(!card) return;
  if(STATE.progress.cardsDone[cid]){
    delete STATE.progress.cardsDone[cid];
    card.classList.remove('done');
    card.querySelector('.card-mark').textContent='Mark Studied';
  } else {
    STATE.progress.cardsDone[cid]=true;
    card.classList.add('done');
    card.querySelector('.card-mark').textContent='✓ Studied';
  }
  await saveProgress();
  // refresh tab pct + tabs
  buildTabs();
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===currentPageId()));
}

function currentPageId(){

function checkSubnet(){
  const i = SUB.order[SUB.idx % SUB.order.length];
  const p = SUBNET_PROBLEMS[i];
  const val = ($('#subInput').value||'').trim();
  SUB.input = val;
  if(!val) return;
  const right = val.replace(/\s+/g,'')===p.answer.replace(/\s+/g,'');
  SUB.feedback = {right};
  SUB.attempts++; if(right) SUB.correct++;
  renderSubCard();
  // update stats
  const el = $('#page-subnet'); if(el) buildPageContent('subnet', el);
}
function revealSubnet(){ SUB.feedback={right:false}; SUB.attempts++; renderSubCard(); const el=$('#page-subnet'); if(el) buildPageContent('subnet',el); }
function skipSubnet(){ SUB.idx++; SUB.input=''; SUB.feedback=null; const el=$('#page-subnet'); if(el) buildPageContent('subnet',el); }

async function answerQuiz(picked){
  const q = STATE.quiz;

  q.answered[q.idx] = ok;

  STATE.progress.domainScores[dom].t++;

        <li><strong>Domain weighting:</strong> D1 20 · D2 20 · D3 25 · D4 10 · D5 15 · D6 10 = 100 Qs.</li>
      </ul>
      <button class="quiz-btn" onclick="startExam()">Begin Mock Exam</button>
    </div>`;
